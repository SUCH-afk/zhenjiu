<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>针灸快速学习</title>
<style>
:root{
  --bg:#F7F8F6;--card:#fff;--primary:#1F6F6B;--primary-soft:#E8F1F0;--text:#1E2A2A;--secondary:#5B6B6B;
  --line:#E3E7E4;--track:#E4E8E6;--correct:#1F7A4D;--correct-bg:#E7F6EE;--correct-border:#8FCB9B;
  --wrong:#C4453C;--wrong-bg:#FDECEC;--wrong-border:#E8A8A3;--meridian-1:#6E7F8D;--meridian-2:#C45C4A;
  --shadow:0 1px 2px rgba(30,42,42,.06),0 4px 12px rgba(30,42,42,.05);
  --radius:12px;--safe-bottom:max(20px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Noto Sans CJK SC","Noto Sans CJK","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:26px;-webkit-font-smoothing:antialiased}
.wrap{max-width:430px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
.page{padding:16px 16px calc(88px + var(--safe-bottom))}
.page.quiz{padding-bottom:calc(100px + var(--safe-bottom))}
.eyebrow{font-size:13px;line-height:18px;letter-spacing:.12em;color:var(--secondary);margin-top:8px}
.title{font-size:24px;line-height:32px;font-weight:700}
.section-label{font-size:13px;line-height:18px;color:var(--secondary);letter-spacing:.12em}
.small{font-size:12px;line-height:18px;color:var(--secondary)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--primary-soft);color:var(--primary);font-size:12px;line-height:18px;font-weight:700}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--meridian-1);flex-shrink:0}
.chip-ghost{background:#EEF1EF;color:var(--secondary);font-weight:400}
.chip-filter{height:32px;padding:0 12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:400;border-radius:16px;font-family:inherit;font-size:12px;margin:0 8px 8px 0}
.chip-filter.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;width:100%;border:none;border-radius:var(--radius);background:var(--primary);color:#fff;font-family:inherit;font-size:16px;line-height:24px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4}
.btn-icon{width:44px;height:44px;border:none;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.start-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:88px;width:100%;border:none;border-radius:16px;background:var(--primary);color:#fff;box-shadow:0 4px 16px rgba(31,111,107,.28);cursor:pointer;font-family:inherit;margin:16px 0 12px;padding:16px}
.start-btn .main{font-size:20px;line-height:28px;font-weight:700}
.start-btn .sub{font-size:12px;line-height:18px;opacity:.85;margin-top:2px}
.two-up{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mini-card,.stat-card,.recent-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.mini-card{cursor:pointer}
.mini-card .k,.stat-card .k,.recent-card .k{font-size:13px;line-height:18px;color:var(--secondary);letter-spacing:.12em}
.mini-card .v{margin-top:6px;font-size:20px;line-height:28px;font-weight:700}
.stat-card .v{margin-top:6px;font-size:28px;line-height:36px;font-weight:700}
.stat-card .hint{margin-top:4px;font-size:12px;line-height:18px;color:var(--secondary)}
.recent-card{padding:14px 14px 6px;margin-top:12px}
.recent-card .k{margin-bottom:8px}
.recent-item{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 0;border-top:1px solid var(--line)}
.recent-item .stem-one{flex:1;font-size:14px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disclaimer{margin-top:18px;font-size:11px;line-height:17px;color:var(--secondary);text-align:center}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-bottom);z-index:20}
.tab{flex:1;min-height:56px;border:0;background:none;color:var(--secondary);font-family:inherit;font-size:11px;line-height:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tab.on{color:var(--primary);font-weight:700}
.quiz-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.progress-ring{position:relative;width:52px;height:52px;flex-shrink:0}
.progress-ring svg{display:block}
.progress-ring .frac{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;line-height:14px}
.progress-track{flex:1;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.progress-track .fill{height:100%;background:var(--primary);border-radius:3px;transition:width .25s}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.stem-card{padding:14px 16px;margin-bottom:10px}
.stem-text{font-size:17px;line-height:28px;font-weight:700}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:center;gap:10px;min-height:56px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:15px;line-height:24px;color:var(--text);cursor:pointer;box-shadow:var(--shadow)}
.option .letter{flex:none;width:28px;height:28px;border-radius:14px;background:#EEF1EF;color:var(--secondary);text-align:center;line-height:28px;font-weight:700;font-size:14px}
.option .opt-text{flex:1}
.option .mark{flex:none;width:22px;height:22px}
.option.selected{border-color:var(--primary);background:var(--primary-soft)}
.option.selected .letter{background:var(--primary);color:#fff}
.option.correct{border-color:var(--correct);background:var(--correct-bg)}
.option.correct .letter{background:var(--correct);color:#fff}
.option.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.option.wrong .letter{background:var(--wrong);color:#fff}
.option.dim{opacity:.55}
.option:disabled{cursor:default}
.bottom-dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;padding:12px 16px var(--safe-bottom);background:linear-gradient(180deg,rgba(247,248,246,0),var(--bg) 28%);z-index:15}
.feedback{border-radius:12px;padding:12px 14px;margin:12px 0 8px;background:var(--wrong-bg);border:1px solid var(--wrong-border)}
.feedback.ok{background:var(--correct-bg);border-color:var(--correct-border)}
.fb-title{font-size:16px;line-height:24px;font-weight:700;color:var(--wrong)}
.feedback.ok .fb-title{color:var(--correct)}
.fb-explain{font-size:15px;line-height:24px;margin-top:4px}
.fb-note{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--secondary)}
.filter-row{display:flex;flex-wrap:wrap;margin:12px 0}
.wb-group{margin:0 0 12px;padding:14px 16px}
.wb-item{padding:10px 0;border-top:1px solid var(--line)}
.wb-item:first-of-type{border-top:0}
.wb-item .q{font-size:15px;line-height:24px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.score{font-size:44px;line-height:56px;font-weight:800;color:var(--primary);text-align:center}
.bar-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.bar-row .lab{flex:none;width:72px;font-size:13px;color:var(--secondary)}
.bar-row .trk{flex:1;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar-row .trk i{display:block;height:100%;background:var(--primary)}
.bar-row .num{flex:none;width:52px;text-align:right;font-size:13px;font-weight:700}
.empty{text-align:center;color:var(--secondary);padding:36px 8px}
.link{color:var(--secondary);text-decoration:underline;background:none;border:0;font:inherit;cursor:pointer}
.cov{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cov span{font-size:12px;padding:4px 10px;border-radius:12px;background:#EEF1EF;color:var(--secondary)}
.cov span.on{background:var(--primary-soft);color:var(--primary);font-weight:700}

.diagram-frame{position:relative;margin:4px 0 10px}.diagram-wrap{position:relative;overflow:auto;-webkit-overflow-scrolling:touch;max-height:min(48vh,380px);background:#E6E8E6;border-radius:12px}.diagram-wrap.answered{max-height:min(38vh,300px)}
.diagram-stage{position:relative;width:100%;line-height:0}
.diagram-stage.z15{width:150%}
.diagram-stage.z20{width:200%}
.diagram-stage.z25{width:250%}
.diagram-stage img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none}
.dmark{position:absolute;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%);box-sizing:border-box}
.dmark.tap{width:22px;height:22px;background:#1F6F6B;border:3px solid #fff;box-shadow:0 0 0 3px rgba(31,111,107,.28)}
.dmark.ok{width:18px;height:18px;background:#1F7A4D;border:3px solid #fff;box-shadow:0 0 0 1px rgba(30,42,42,.15);z-index:2}
.dmark.tol{border:2px dashed #1F7A4D;background:rgba(31,122,77,.10);z-index:1;height:auto;padding:0;aspect-ratio:1}
.zoom-stack{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
.zoom-btn{width:44px;height:44px;border:0;border-radius:10px;background:#fff;color:var(--text);font-size:22px;line-height:44px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
.d-legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 8px;font-size:11px;line-height:14px;color:var(--secondary)}
.d-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(30,42,42,.15)}
.d-legend i.tap{background:#1F6F6B}
.d-legend i.ok{background:#1F7A4D}.dmark.tap.wrong{background:#C4453C;box-shadow:0 0 0 3px rgba(196,69,60,.28)}.dmark.prompt{width:20px;height:20px;background:transparent;border:3px solid #1F6F6B;box-shadow:0 0 0 3px #fff,0 0 0 4px rgba(31,111,107,.35);z-index:2}.d-legend i.prompt{background:transparent;border:2px solid #1F6F6B;box-shadow:0 0 0 1px #fff}.d-legend i.wrong{background:#C4453C}.diagram-wrap.identify{max-height:min(32vh,260px)}
.alt-box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
.alt-box .k{font-size:12px;line-height:18px;color:var(--secondary);margin-bottom:2px}
.alt-box .t{font-size:13px;line-height:20px}

.mer-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin:0 0 12px}
.mer-card .k{font-size:12px;line-height:18px;color:var(--secondary)}
.mer-toggles{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mer-toggle{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--line);background:#fff;border-radius:12px;font-family:inherit;font-size:15px;line-height:22px;color:var(--text);cursor:pointer;text-align:left}
.mer-toggle.on{border-color:var(--primary);background:var(--primary-soft);font-weight:700;color:var(--text)}
.mer-toggle .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.mer-toggle .chk{margin-left:auto;color:var(--primary);font-size:16px;font-weight:700}
.mer-card .hint{margin-top:8px;font-size:12px;line-height:18px;color:var(--secondary)}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var BANK=[{"id":"LU-zhongfu-loc","type":"定位文字题","point":"中府","term":"","meridian":"手太阴肺经","stem":"中府的定位是？","options":["横平第 1 肋间隙，锁骨下窝外侧，前正中线旁开 6 寸","锁骨下窝凹陷中，喙突内缘，前正中线旁开 6 寸","横平第 2 肋间隙，前正中线旁开 6 寸","横平第 1 肋间隙，前正中线旁开 4 寸"],"answer":0,"explain":"云门在锁骨下窝，中府在其下 1 寸、平第 1 肋间隙；两穴都是前正中线旁开 6 寸，不是 4 寸。"},{"id":"LU-zhongfu-spec","type":"特定穴归类","point":"中府","term":"募穴","meridian":"手太阴肺经","stem":"中府属于？","options":["肺之募穴，也是手足太阴交会穴","肺之背俞穴","肺经郄穴","八会穴之脉会"],"answer":0,"explain":"肺的背俞是肺俞，郄穴是孔最，脉会是太渊。"},{"id":"LU-zhongfu-combo","type":"配伍题","point":"中府","term":"俞募配穴","meridian":"手太阴肺经","stem":"治疗肺系病证，中府常与哪个穴组成俞募配穴？","options":["肺俞","太渊","尺泽","列缺"],"answer":0,"explain":"中府是肺募，肺俞是肺的背俞穴，二穴俞募相配。"},{"id":"LU-zhongfu-safe","type":"安全考点","point":"中府","term":"","meridian":"手太阴肺经","stem":"关于中府，下列哪项正确？","options":["取穴针刺时不可向内深刺","它是肺经络穴","它位于腋前纹头下 3 寸","它是八脉交会穴"],"answer":0,"explain":"中府在胸外侧近肺脏，不可向内深刺；络穴是列缺，腋前纹头下 3 寸是天府。"},{"id":"LU-yunmen-loc","type":"定位文字题","point":"云门","term":"","meridian":"手太阴肺经","stem":"云门的定位是？","options":["锁骨下窝凹陷中，喙突内缘，前正中线旁开 6 寸","横平第 1 肋间隙，锁骨下窝外侧，前正中线旁开 6 寸","锁骨上窝，前正中线旁开 6 寸","喙突外缘，前正中线旁开 4 寸"],"answer":0,"explain":"中府在云门下 1 寸、平第 1 肋间隙；云门就在锁骨下窝，两穴都是旁开 6 寸。"},{"id":"LU-yunmen-safe","type":"安全考点","point":"云门","term":"","meridian":"手太阴肺经","stem":"云门与中府都要注意的是？","options":["不可向内深刺","须避开桡动脉","只用于急救点刺","位于上臂内侧"],"answer":0,"explain":"两穴都在胸外侧近肺脏，不可向内深刺；避开桡动脉的是太渊、经渠。"},{"id":"LU-tianfu-loc","type":"定位文字题","point":"天府","term":"","meridian":"手太阴肺经","stem":"天府的定位是？","options":["腋前纹头下 3 寸，肱二头肌桡侧缘","腋前纹头下 4 寸，肱二头肌桡侧缘","腋前纹头下 3 寸，肱二头肌尺侧缘","肘横纹上 3 寸，肱二头肌腱桡侧"],"answer":0,"explain":"侠白在腋前纹头下 4 寸；天府、侠白都在肱二头肌桡侧缘。"},{"id":"LU-tianfu-ind","type":"主治","point":"天府","term":"","meridian":"手太阴肺经","stem":"下列哪项更符合天府的主治特点？","options":["鼻衄、瘿气","无脉症","痔疾","口喎、齿痛"],"answer":0,"explain":"无脉症取太渊，痔疾取孔最，口喎、齿痛取列缺。"},{"id":"LU-xiabai-loc","type":"定位文字题","point":"侠白","term":"","meridian":"手太阴肺经","stem":"侠白的定位是？","options":["腋前纹头下 4 寸，肱二头肌桡侧缘（或肘横纹上 5 寸）","腋前纹头下 3 寸，肱二头肌桡侧缘","肘横纹上 4 寸，尺泽与太渊连线上","腋前纹头下 4 寸，肱二头肌尺侧缘"],"answer":0,"explain":"天府在腋前纹头下 3 寸；腋前纹头到肘横纹是 9 寸，所以侠白也就是肘横纹上 5 寸。"},{"id":"LU-xiabai-ind","type":"主治","point":"侠白","term":"","meridian":"手太阴肺经","stem":"侠白除咳喘外，还常考的主治是？","options":["干呕、烦满、上臂内侧痛","痔疾、咳血","昏迷、癫狂","无脉症"],"answer":0,"explain":"痔疾、咳血侧重孔最，昏迷、癫狂侧重少商，无脉症侧重太渊。"},{"id":"LU-chize-loc","type":"定位文字题","point":"尺泽","term":"","meridian":"手太阴肺经","stem":"尺泽的定位是？","options":["肘横纹上，肱二头肌腱桡侧缘凹陷中","肘横纹上，肱二头肌腱尺侧缘凹陷中","肘横纹上，肱骨内上髁前方","腕掌侧远端横纹上，肱二头肌腱桡侧"],"answer":0,"explain":"肱二头肌腱尺侧是手厥阴的曲泽，不要和尺泽弄反。"},{"id":"LU-chize-spec","type":"特定穴归类","point":"尺泽","term":"五输穴","meridian":"手太阴肺经","stem":"尺泽是肺经的？","options":["合穴，五行属水，也是子穴","经穴，五行属金，也是本穴","输穴，五行属土，也是母穴","郄穴"],"answer":0,"explain":"肺属金，合穴属水，所以尺泽是子穴；本穴是经渠，母穴是太渊，郄穴是孔最。"},{"id":"LU-chize-ind","type":"主治","point":"尺泽","term":"","meridian":"手太阴肺经","stem":"尺泽较有特点的主治是？","options":["咳血、潮热，以及急性吐泻、肘臂挛痛","无脉症","痔疾","口喎、项强"],"answer":0,"explain":"无脉症取太渊，痔疾取孔最，口喎、项强取列缺。"},{"id":"LU-chize-combo","type":"配伍题","point":"尺泽","term":"","meridian":"手太阴肺经","stem":"咳血、潮热，尺泽常配哪个穴？","options":["孔最","偏历","照海","商阳"],"answer":0,"explain":"尺泽是合穴，孔最是郄穴，二穴常配用于咳血、潮热。"},{"id":"LU-kongzui-loc","type":"定位文字题","point":"孔最","term":"","meridian":"手太阴肺经","stem":"孔最的定位是？","options":["腕掌侧远端横纹上 7 寸，尺泽与太渊连线上","腕掌侧远端横纹上 5 寸，尺泽与太渊连线上","肘横纹下 7 寸，尺泽与太渊连线上","腕掌侧远端横纹上 1.5 寸，桡骨茎突上方"],"answer":0,"explain":"肘横纹到腕横纹是 12 寸，腕上 7 寸就是尺泽下 5 寸；腕上 1.5 寸是列缺。"},{"id":"LU-kongzui-spec","type":"特定穴归类","point":"孔最","term":"郄穴","meridian":"手太阴肺经","stem":"孔最是肺经的？","options":["郄穴","络穴","合穴","募穴"],"answer":0,"explain":"肺经络穴是列缺，合穴是尺泽，募穴是中府。"},{"id":"LU-kongzui-ind","type":"主治","point":"孔最","term":"郄穴","meridian":"手太阴肺经","stem":"孔最较有特点的主治是？","options":["咳血、痔疾","无脉症","口喎、齿痛","瘿气"],"answer":0,"explain":"郄穴多用于急性病和血证，肺经郄穴故常考咳血，也考痔疾。"},{"id":"LU-kongzui-combo","type":"配伍题","point":"孔最","term":"","meridian":"手太阴肺经","stem":"咳血时，孔最常配哪个穴？","options":["鱼际","商阳","照海","内关"],"answer":0,"explain":"孔最是郄穴，鱼际是荥穴，二穴常配用于咳血。"},{"id":"LU-lieque-loc","type":"定位文字题","point":"列缺","term":"","meridian":"手太阴肺经","stem":"列缺在哪？","options":["腕掌侧远端横纹上 1.5 寸，拇短伸肌腱与拇长展肌腱之间","腕掌侧远端横纹上 1 寸，桡骨茎突与桡动脉之间","腕掌侧远端横纹桡侧，桡动脉搏动处","腕掌侧远端横纹上 7 寸，尺泽与太渊连线上"],"answer":0,"explain":"另外三个选项分别是经渠、太渊、孔最的定位，四个都在前臂桡侧，最容易混。"},{"id":"LU-lieque-easy","type":"定位文字题","point":"列缺","term":"","meridian":"手太阴肺经","stem":"两手虎口交叉，一手食指按在另一手桡骨茎突上，指尖下取的是？","options":["列缺","经渠","太渊","阳溪"],"answer":0,"explain":"这是列缺的简便取穴法；经渠在腕上 1 寸，太渊在腕横纹桡侧。"},{"id":"LU-lieque-spec","type":"特定穴归类","point":"列缺","term":"八脉交会穴","meridian":"手太阴肺经","stem":"列缺同时是？","options":["络穴，也是八脉交会穴，通任脉","原穴，也是八会穴之脉会","郄穴，也是肺募穴","络穴，也是八脉交会穴，通督脉"],"answer":0,"explain":"通督脉的是后溪；脉会和原穴是太渊，郄穴是孔最，肺募是中府。"},{"id":"LU-lieque-why","type":"主治","point":"列缺","term":"络穴","meridian":"手太阴肺经","stem":"「头项寻列缺」，列缺能管头项，主要因为它是？","options":["络穴，联络手阳明大肠经","井穴","肺之募穴","郄穴"],"answer":0,"explain":"肺经本身不上头，靠络穴连到手阳明，手阳明经脉上头面。"},{"id":"LU-lieque-zhaohai","type":"配伍题","point":"列缺","term":"八脉交会穴","meridian":"手太阴肺经","stem":"八脉交会穴里，跟列缺相配、合于肺系咽喉胸膈的是？","options":["照海","公孙","后溪","外关"],"answer":0,"explain":"列缺通任脉，照海通阴跷，两穴上下相配。"},{"id":"LU-lieque-hegu","type":"配伍题","point":"列缺","term":"原络配穴","meridian":"手太阴肺经","stem":"列缺配合谷属于哪种配穴，常用于伤风、头痛、项强？","options":["原络配穴","俞募配穴","八脉交会配穴","母子补泻"],"answer":0,"explain":"列缺是肺经络穴，合谷是大肠经原穴，这是原络配；俞募是中府配肺俞，八脉交会是列缺配照海。"},{"id":"LU-jingqu-loc","type":"定位文字题","point":"经渠","term":"","meridian":"手太阴肺经","stem":"经渠的定位是？","options":["腕掌侧远端横纹上 1 寸，桡骨茎突与桡动脉之间","腕掌侧远端横纹上 1.5 寸，拇短伸肌腱与拇长展肌腱之间","腕掌侧远端横纹桡侧，桡动脉搏动处","腕掌侧远端横纹上 7 寸，尺泽与太渊连线上"],"answer":0,"explain":"腕上 1.5 寸是列缺，桡动脉搏动处是太渊的教材表述，腕上 7 寸是孔最。"},{"id":"LU-jingqu-spec","type":"特定穴归类","point":"经渠","term":"五输穴","meridian":"手太阴肺经","stem":"经渠是肺经的？","options":["经穴，五行属金，也是本穴","输穴，五行属土，也是母穴","合穴，五行属水，也是子穴","荥穴，五行属火"],"answer":0,"explain":"肺属金，经穴也属金，所以经渠是本穴；母穴是太渊，子穴是尺泽，荥穴是鱼际。"},{"id":"LU-jingqu-safe","type":"安全考点","point":"经渠","term":"","meridian":"手太阴肺经","stem":"取经渠时应注意？","options":["避开桡动脉","不可向内深刺胸腔","只可用于点刺出血","必须在寅时取穴"],"answer":0,"explain":"经渠就在桡骨茎突与桡动脉之间，须避开桡动脉；不可向内深刺的是中府、云门。"},{"id":"LU-taiyuan-loc","type":"定位文字题","point":"太渊","term":"","meridian":"手太阴肺经","stem":"按腧穴定位国标，太渊在哪？","options":["桡骨茎突与舟状骨之间，拇长展肌腱尺侧凹陷中","桡骨茎突与桡动脉之间，腕掌侧远端横纹上 1 寸","桡骨茎突上方，腕掌侧远端横纹上 1.5 寸","第 1 掌骨桡侧中点，赤白肉际处"],"answer":0,"explain":"另外三项分别是经渠、列缺、鱼际。教材也常写成「腕掌侧横纹桡侧，桡动脉搏动处」，指的是同一部位。"},{"id":"LU-taiyuan-spec","type":"特定穴归类","point":"太渊","term":"八会穴","meridian":"手太阴肺经","stem":"太渊是肺经输穴、原穴，还是八会穴里的哪一会？","options":["脉会","气会","血会","筋会"],"answer":0,"explain":"「脉会太渊」；阴经以输代原，所以太渊一穴身兼输穴、原穴、脉会。"},{"id":"LU-taiyuan-yuan","type":"名词题","point":"太渊","term":"阴经以输代原","meridian":"手太阴肺经","stem":"太渊能同时作为输穴和原穴，是因为？","options":["阴经以输代原","阳经以输代原","它是八脉交会穴","它是郄穴"],"answer":0,"explain":"阴经不以另外的原穴单独出现，就以本经输穴为原；阳经是在输穴之后另有原穴。"},{"id":"LU-taiyuan-pianli","type":"配伍题","point":"太渊","term":"原络配穴","meridian":"手太阴肺经","stem":"太渊配哪个穴属于原络配穴？","options":["偏历","合谷","照海","肺俞"],"answer":0,"explain":"太渊是本经原穴，应配表里经大肠经的络穴偏历；合谷是大肠经原穴，与肺经组成原络配的是列缺配合谷。"},{"id":"LU-taiyuan-renying","type":"配伍题","point":"太渊","term":"八会穴","meridian":"手太阴肺经","stem":"无脉症，太渊常配哪个穴？","options":["人迎","少商","孔最","商阳"],"answer":0,"explain":"太渊是脉会，常与人迎相配用于无脉症。"},{"id":"LU-taiyuan-mother","type":"特定穴归类","point":"太渊","term":"母子补泻","meridian":"手太阴肺经","stem":"肺经虚证「虚则补其母」，应取的母穴是？","options":["太渊","尺泽","经渠","鱼际"],"answer":0,"explain":"这就是母子补泻。肺属金，输穴太渊属土，为母穴；尺泽属水，为子穴，用于「实则泻其子」。"},{"id":"LU-yuji-loc","type":"定位文字题","point":"鱼际","term":"赤白肉际","meridian":"手太阴肺经","stem":"鱼际的定位是？","options":["第 1 掌骨桡侧中点，赤白肉际处","第 1 掌骨尺侧中点，赤白肉际处","第 2 掌骨桡侧中点","拇指末节桡侧，指甲根角侧上方 0.1 寸"],"answer":0,"explain":"少商在指甲角旁；鱼际在第 1 掌骨桡侧、赤白肉际。"},{"id":"LU-yuji-spec","type":"特定穴归类","point":"鱼际","term":"五输穴","meridian":"手太阴肺经","stem":"鱼际是肺经的？","options":["荥穴，五行属火","井穴，五行属木","经穴，五行属金","输穴，五行属土"],"answer":0,"explain":"阴经五输是井木、荥火、输土、经金、合水，所以鱼际是荥火。"},{"id":"LU-yuji-ind","type":"主治","point":"鱼际","term":"","meridian":"手太阴肺经","stem":"鱼际较有特点的主治是？","options":["咳血、咽喉肿痛、失音、发热","无脉症","痔疾","项强、口喎"],"answer":0,"explain":"无脉症取太渊，痔疾取孔最，项强、口喎取列缺。"},{"id":"LU-shaoshang-loc","type":"定位文字题","point":"少商","term":"","meridian":"手太阴肺经","stem":"少商的定位是？","options":["拇指 ","point":"","term":"是动病","meridian":"手太阴肺经","stem":"肺经「是动病」常见的病候特点是？","options":["肺胀、膨膨而喘咳、缺盆中痛","只有掌中热","只表现为痔疾","以神志昏迷为主"],"answer":0,"explain":"是动病以肺胀喘咳、缺盆中痛为要点；掌中热、臂内侧痛等是所生病的常见表述。"},{"id":"LU-wushu-order","type":"特定穴归类","point":"","term":"五输穴","meridian":"手太阴肺经","stem":"肺经五输穴从井到合的顺序是？","options":["少商、鱼际、太渊、经渠、尺泽","少商、鱼际、经渠、太渊、尺泽","少商、太渊、鱼际、经渠、尺泽","鱼际、少商、太渊、经渠、尺泽"],"answer":0,"explain":"井荥输经合分别是少商、鱼际、太渊、经渠、尺泽，不要把太渊和经渠的位置对调。"},{"id":"LU-term-deqi","type":"名词题","point":"","term":"得气","meridian":"手太阴肺经","stem":"「得气」指的是？","options":["针刺后针下产生的经气感应","进针时皮肤出现的红晕","留针时患者打瞌睡","起针后局部出血"],"answer":0,"explain":"病人觉得酸麻胀重，施针者手下觉得沉紧，这两种感觉都算得气。"},{"id":"LU-term-yinyuan","type":"名词题","point":"太渊","term":"阴经以输代原","meridian":"手太阴肺经","stem":"「阴经以输代原」的意思是？","options":["阴经以本经输穴作为原穴","阴经没有输穴，只用原穴","阳经的原穴就是输穴","所有原穴都可以代替输穴"],"answer":0,"explain":"阴经不另设原穴，就以输穴为原，所以太渊既是输穴也是原穴。"},{"id":"LU-term-muzi","type":"名词题","point":"尺泽","term":"母子补泻","meridian":"手太阴肺经","stem":"「实则泻其子」，肺经应取哪一穴？","options":["尺泽","太渊","经渠","鱼际"],"answer":0,"explain":"这就是母子补泻。肺属金，合穴尺泽属水为子穴；太渊是母穴，用于虚则补其母。"},{"id":"LU-term-feishu","type":"名词题","point":"中府","term":"背俞穴","meridian":"手太阴肺经","stem":"肺俞属于哪一类特定穴？","options":["背俞穴","募穴","八会穴","郄穴"],"answer":0,"explain":"肺的背俞是肺俞，募穴是中府，二穴可作俞募配。"},{"id":"LU-term-xi","type":"名词题","point":"孔最","term":"郄穴","meridian":"手太阴肺经","stem":"郄穴多用于？","options":["急性病证和血证","脏腑虚证的补法专用","只治疗经脉循行局部","开窍醒神"],"answer":0,"explain":"所以肺经郄穴孔最常考咳血。"},{"id":"LU-term-maihui","type":"名词题","point":"太渊","term":"八会穴","meridian":"手太阴肺经","stem":"八会穴中，脉会是哪一穴？","options":["太渊","中府","列缺","尺泽"],"answer":0,"explain":"「脉会太渊」。"},{"id":"LU-term-mu","type":"名词题","point":"中府","term":"募穴","meridian":"手太阴肺经","stem":"募穴指的是？","options":["脏腑之气结聚于胸腹部的腧穴","脏腑之气输注于背腰部的腧穴","络脉从本经分出的腧穴","经气深聚的腧穴"],"answer":0,"explain":"第二项是背俞穴，第三项是络穴，第四项是郄穴。"},{"id":"LU-bone-arm","type":"名词题","point":"","term":"骨度分寸","meridian":"手太阴肺经","stem":"腋前纹头至肘横纹的骨度是？","options":["9 寸","8 寸","12 寸","6 寸"],"answer":0,"explain":"两乳头之间是 8 寸，肘横纹至腕掌侧远端横纹是 12 寸，前正中线 ","浅刺或点刺出血为主","向上斜刺为主","斜刺或平刺为主"],"answer":0,"explain":"教材对二间写作直刺。浅刺或点刺出血是商阳，向上斜刺是臂臑，斜刺或平刺是迎香。二间在指根，宜浅，不可深刺。"},{"id":"LI-erjian-mix","type":"定位文字题","meridian":"手阳明大肠经","point":"二间","term":"","stem":"二间与三间都在第2掌指关节桡侧，二者的区别是？","options":["二间在关节远端（本节前），三间在关节近端（本节后）","二间在关节近端，三间在关节远端","二间在尺侧，三间在桡侧","二者定位相同，只是左右不同"],"answer":0,"explain":"远端、本节前是二间，近端、本节后是三间。歌诀「本节前取二间定，本节后取三间强」。"},{"id":"LI-sanjian-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"三间","term":"","stem":"三间的定位是？","options":["在手背，第2掌指关节桡侧近端凹陷中。","在手指，第2掌指关节桡侧远端赤白肉际处。","在手背，第一掌骨和第二掌骨之间，约平第2掌骨桡侧的中点。","在腕后外侧，腕背侧远端横纹桡侧，桡骨茎突远端，解剖学“鼻烟窝”凹陷中。"],"answer":0,"explain":"本节后（近端）是三间。合谷更靠近第2掌骨中点，阳溪在鼻烟窝。"},{"id":"LI-sanjian-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"三间","term":"五输穴","stem":"三间是大肠经的？","options":["输穴，五行属木","原穴","荥穴，五行属水","经穴，五行属火"],"answer":0,"explain":"阳经输穴属木。大肠经原穴是另设的合谷，不是三间。这就是阳经「输、原分穴」。"},{"id":"LI-sanjian-ind","type":"主治","meridian":"手阳明大肠经","point":"三间","term":"","stem":"三间的主治主要是？","options":["齿痛、咽喉肿痛、目痛，以及手背肿痛","无脉症","痰多、咳嗽","乳痈"],"answer":0,"explain":"三间以齿痛、咽喉肿痛、目痛和局部手背肿痛为常考点。"},{"id":"LI-sanjian-op","type":"操作考点","meridian":"手阳明大肠经","point":"三间","term":"","stem":"三间常用的刺法是？","options":["直刺","浅刺或点刺出血为主","向上斜刺为主","斜刺或平刺为主"],"answer":0,"explain":"教材对三间写作直刺。浅刺或点刺出血是商阳，向上斜刺是臂臑，斜刺或平刺是迎香。"},{"id":"LI-sanjian-hegu","type":"定位文字题","meridian":"手阳明大肠经","point":"三间","term":"","stem":"三间与合谷都靠近第2掌骨桡侧，最稳妥的区分是？","options":["三间在第2掌指关节近端凹陷中，合谷约平第2掌骨桡侧的中点","三间约平第2掌骨中点，合谷在掌指关节后","三间在鼻烟窝，合谷在腕上3寸","二者只是深浅不同，位置相同"],"answer":0,"explain":"合谷在两掌骨之间、约平第2掌骨桡侧中点，比三间更靠近腕侧。"},{"id":"LI-hegu-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"合谷","term":"","stem":"合谷的定位是？","options":["在手背，第一掌骨和第二掌骨之间，约平第2掌骨桡侧的中点。","在手背，第2掌指关节桡侧近端凹陷中。","在腕后外侧，腕背侧远端横纹桡侧，桡骨茎突远端，解剖学“鼻烟窝”凹陷中。","在手掌，第5掌指关节尺侧近端，赤白肉际凹陷中。"],"answer":0,"explain":"国标原文如此。三间在第2掌指关节后，阳溪在鼻烟窝，后溪在第5掌指关节尺侧。教材简便取穴：以一手拇指指骨关节横纹放在另一手拇、食指之间的指蹼缘上，拇指尖下是穴，与国标为同一部位。"},{"id":"LI-hegu-jianbian","type":"定位文字题","meridian":"手阳明大肠经","point":"合谷","term":"","stem":"教材所载合谷的简便取穴法是？","options":["以一手拇指指骨关节横纹，放在另一手拇、食指之间的指蹼缘上，当拇指尖下是穴","拇指充分外展后伸，取鼻烟窝最凹陷处","微握拳，取第2掌指关节桡侧远端赤白肉际","屈肘，取肘横纹外侧端凹陷中"],"answer":0,"explain":"这是教材补充的简便取穴，所指仍是第1、2掌骨之间、约平第2掌骨桡侧中点，与国标为同一部位。鼻烟窝是阳溪，本节前是二间，肘横纹外侧端是曲池。"},{"id":"LI-hegu-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"合谷","term":"原穴","stem":"合谷是大肠经的？","options":["原穴，也是四总穴之一","输穴，五行属木","络穴","合穴"],"answer":0,"explain":"合谷是原穴，歌诀「面口合谷收」。输穴是三间，络穴是偏历，合穴是曲池。别名虎口。"},{"id":"LI-hegu-sizong","type":"名词题","meridian":"手阳明大肠经","point":"合谷","term":"四总穴","stem":"「面口合谷收」的意思是？","options":["合谷是治疗头面五官病证的要穴","合谷只治疗大肠腑病","合谷只治疗上肢局部病","合谷是大肠下合穴"],"answer":0,"explain":"四总穴歌「面口合谷收」。大肠下合穴是上巨虚，在胃经。"},{"id":"LI-hegu-siguán","type":"配伍题","meridian":"手阳明大肠经","point":"合谷","term":"开四关","stem":"「开四关」是指哪两个穴相配？","options":["合谷、太冲","合谷、列缺","合谷、曲池","合谷、太渊"],"answer":0,"explain":"开四关是合谷配肝经原穴太冲。合谷配列缺是原络配，合谷配曲池常用于清热，都不是开四关。合谷配太渊也不是原络配。"},{"id":"LI-hegu-ind","type":"主治","meridian":"手阳明大肠经","point":"合谷","term":"","stem":"合谷除头面五官病外，还常考哪一类病证？","options":["外感发热，热病无汗或多汗，以及经闭、滞产","无脉症","痰多、咳嗽为主","遗尿、水肿为主"],"answer":0,"explain":"合谷既治头痛、目赤、齿痛、鼻衄、口喎、耳聋、咽喉肿痛等头面五官病，也常用于外感、热病汗出异常，以及经闭、滞产等妇产科病证。"},{"id":"LI-hegu-ind-face","type":"主治","meridian":"手阳明大肠经","point":"合谷","term":"四总穴","stem":"下列哪项最能体现合谷「面口合谷收」的主治特点？","options":["头痛、目赤肿痛、齿痛、鼻衄、口眼喎斜、咽喉肿痛","只治疗肘臂挛痛","只治疗肠鸣、泄泻","只治疗瘰疬、瘿气"],"answer":0,"explain":"头面五官病是合谷最核心的主治，肘臂、肠腑、瘰疬不是这条歌诀要强调的内容。"},{"id":"LI-hegu-op","type":"操作考点","meridian":"手阳明大肠经","point":"合谷","term":"","stem":"合谷常用的刺法是？","options":["直刺，针刺时手呈半握拳状","浅刺或点刺出血","略向内上方斜刺或平刺","直刺或向下斜刺，取穴时臂外展"],"answer":0,"explain":"教材写合谷直刺，并常补充手呈半握拳状；孕妇禁针。向下斜刺、臂外展是肩髃。"},{"id":"LI-hegu-safe","type":"安全考点","meridian":"手阳明大肠经","point":"合谷","term":"","stem":"关于合谷，下列哪项正确？","options":["孕妇禁针","它是大肠经络穴","它位于解剖学鼻烟窝中","它是大肠下合穴"],"answer":0,"explain":"教材作孕妇禁针，亦有写作孕妇不宜针，都是同一条妊娠禁忌，记结论即可。络穴是偏历，鼻烟窝是阳溪，大肠下合穴是上巨虚。"},{"id":"LI-hegu-lieque","type":"配伍题","meridian":"手阳明大肠经","point":"合谷","term":"原络配穴","stem":"合谷配列缺属于哪种配穴，常用于伤风、头痛、项强？","options":["原络配穴","俞募配穴","开四关","下合配穴"],"answer":0,"explain":"合谷是大肠经原穴，列缺是肺经络穴，这是表里经的原络配。开四关是合谷配太冲，俞募是天枢配大肠俞。"},{"id":"LI-hegu-yingxiang","type":"配伍题","meridian":"手阳明大肠经","point":"合谷","term":"","stem":"鼻塞、鼽衄等鼻病，合谷常配哪个穴？","options":["迎香","曲池","上巨虚","大肠俞"],"answer":0,"explain":"迎香配本经原穴合谷，是治疗鼻病的常用配伍。"},{"id":"LI-hegu-tooth","type":"配伍题","meridian":"手阳明大肠经","point":"合谷","term":"","stem":"齿痛，合谷常配哪个穴？","options":["颊车或下关","太渊","肺俞","中府"],"answer":0,"explain":"合谷配颊车或下关，是教材常列的齿痛配伍。"},{"id":"LI-hegu-alias","type":"名词题","meridian":"手阳明大肠经","point":"合谷","term":"","stem":"合谷的常用别名是？","options":["虎口","鼻烟窝","绝骨","膝眼"],"answer":0,"explain":"合谷别名虎口。鼻烟窝是阳溪的解剖学定位，不是穴名。"},{"id":"LI-yangxi-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"阳溪","term":"","stem":"阳溪的定位是？","options":["在腕后外侧，腕背侧远端横纹桡侧，桡骨茎突远端，解剖学“鼻烟窝”凹陷中。","在前臂后外侧，腕背侧远端横纹上3寸，阳溪（LI5）与曲池（LI11）连线上。","在腕区，腕背侧远端横纹上，指伸肌腱的尺侧缘凹陷中。","在前臂，腕掌侧远端横纹上1.5寸，拇短伸肌腱与拇长展肌腱之间。"],"answer":0,"explain":"国标原文如此。注：拇指充分外展和后伸时，拇长伸肌腱与拇短伸肌腱之间的凹陷即解剖学鼻烟窝，最凹陷处是本穴。阳池在腕背横纹、指伸肌腱尺侧；列缺在腕掌侧上1.5寸；偏历在腕上3寸。"},{"id":"LI-yangxi-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"阳溪","term":"五输穴","stem":"阳溪是大肠经的？","options":["经穴，五行属火","合穴，五行属土","络穴","郄穴"],"answer":0,"explain":"阳经经穴属火。合穴是曲池，络穴是偏历，郄穴是温溜。"},{"id":"LI-yangxi-ind","type":"主治","meridian":"手阳明大肠经","point":"阳溪","term":"","stem":"阳溪的主治主要是？","options":["头痛、目赤肿痛、耳鸣耳聋、齿痛、咽喉肿痛、手腕痛","肠鸣、腹痛为主","水肿为主","瘿气、暴喑为主"],"answer":0,"explain":"阳溪既治头面五官病，也治局部手腕痛。"},{"id":"LI-yangxi-op","type":"操作考点","meridian":"手阳明大肠经","point":"阳溪","term":"","stem":"阳溪常用的刺法是？","options":["直刺","点刺出血","向内上方斜刺或平刺","直刺并须避开足背动脉"],"answer":0,"explain":"阳溪在腕后外侧鼻烟窝，教材作直刺。点刺出血是商阳等井穴的考点，向内上斜刺或平刺是迎香。教材对阳溪深度写法略有出入，本题只考刺法方向，不拿两个深度范围互相对打。"},{"id":"LI-yangxi-mix","type":"定位文字题","meridian":"手阳明大肠经","point":"阳溪","term":"","stem":"阳溪与阳池最重要的区别是？","options":["阳溪在腕背桡侧、解剖学鼻烟窝中，阳池在腕背横纹、指伸肌腱尺侧缘凹陷中","二者都在鼻烟窝，只是深浅不同","阳溪在腕掌侧，阳池在腕背侧","阳溪是三焦经穴，阳池是大肠经穴"],"answer":0,"explain":"阳溪属大肠经、在桡侧鼻烟窝；阳池是三焦经原穴、在腕背偏尺侧。"},{"id":"LI-pianli-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"偏历","term":"","stem":"偏历的定位是？","options":["在前臂后外侧，腕背侧远端横纹上3寸，阳溪（LI5）与曲池（LI11）连线上。","在前臂后外侧，腕背侧远端横纹上5寸，阳溪（LI5）与曲池（LI11）连线上。","在前臂后外侧，肘横纹下2寸，阳溪（LI5）与曲池（LI11）连线上。","在前臂后外侧，肘横纹下4寸，阳溪（LI5）与曲池（LI11）连线上。"],"answer":0,"explain":"国标原文如此。注：即阳溪与曲池连线的下1/4与上3/4交点。温溜在腕上5寸，手三里在肘下2寸，下廉在肘下4寸。阳溪至曲池折作12寸。"},{"id":"LI-pianli-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"偏历","term":"络穴","stem":"偏历是大肠经的？","options":["络穴","原穴","郄穴","合穴"],"answer":0,"explain":"大肠经络穴是偏历，原穴是合谷，郄穴是温溜，合穴是曲池。"},{"id":"LI-pianli-combo","type":"配伍题","meridian":"手阳明大肠经","point":"偏历","term":"原络配穴","stem":"太渊配偏历属于哪种配穴？","options":["原络配穴","俞募配穴","开四关","母子补泻"],"answer":0,"explain":"太渊是肺经原穴，偏历是大肠经络穴，这是表里经的原络配。不要写成合谷配太渊。"},{"id":"LI-pianli-ind","type":"主治","meridian":"手阳明大肠经","point":"偏历","term":"","stem":"偏历较有特点的主治是？","options":["目赤、耳鸣、鼻衄、喉痛、手臂酸痛，以及水肿","滞产","膝肿痛","乳汁少"],"answer":0,"explain":"络穴偏历除头面五官和手臂病外，还常考水肿。"},{"id":"LI-pianli-op","type":"操作考点","meridian":"手阳明大肠经","point":"偏历","term":"","stem":"偏历常用的刺法是？","options":["直刺或斜刺","浅刺或点刺出血","直刺，微斜向外下方","略向内上方斜刺或平刺"],"answer":0,"explain":"教材写偏历直刺或斜刺。微斜向外下方是巨骨，向内上斜刺或平刺是迎香。"},{"id":"LI-pianli-mix","type":"定位文字题","meridian":"手阳明大肠经","point":"偏历","term":"","stem":"偏历与温溜都在阳溪与曲池连线上，二者的区别是？","options":["偏历在腕背侧远端横纹上3寸，温溜在腕背侧远端横纹上5寸","偏历在腕上5寸，温溜在腕上3寸","偏历在肘横纹下3寸，温溜在肘横纹下5寸","二者位置相同，只是特定穴属性不同"],"answer":0,"explain":"络穴偏历更靠近腕（腕上3寸），郄穴温溜在腕上5寸。"},{"id":"LI-wenliu-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"温溜","term":"","stem":"温溜的定位是？","options":["在前臂后外侧，腕背侧远端横纹上5寸，阳溪（LI5）与曲池（LI11）连线上。","在前臂后外侧，腕背侧远端横纹上3寸，阳溪（LI5）与曲池（LI11）连线上。","在前臂后外侧，肘横纹下3寸，阳溪（LI5）与曲池（LI11）连线上。","在臂外侧，肘横纹上3寸，曲池（LI11）与肩髃（LI15）连线上。"],"answer":0,"explain":"温溜在腕上5寸。偏历在腕上3寸，上廉在肘下3寸，手五里在肘上3寸。"},{"id":"LI-wenliu-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"温溜","term":"郄穴","stem":"温溜是大肠经的？","options":["郄穴","络穴","合穴","募穴"],"answer":0,"explain":"大肠经郄穴是温溜。络穴是偏历，合穴是曲池，大肠募穴是天枢。"},{"id":"LI-wenliu-ind","type":"主治","meridian":"手阳明大肠经","point":"温溜","term":"","stem":"温溜较有特点的主治是？","options":["急性头痛、面肿、咽喉肿痛、齿痛，以及肠鸣腹痛","无脉症","痰多、咳嗽","阴挺"],"answer":0,"explain":"郄穴多用于急症，大肠经郄穴故常考急性头面、咽喉、齿痛和肠鸣腹痛。"},{"id":"LI-wenliu-op","type":"操作考点","meridian":"手阳明大肠经","point":"温溜","term":"","stem":"温溜常用的刺法是？","options":["直刺","浅刺或点刺出血为主","向上斜刺为主","斜刺或平刺为主"],"answer":0,"explain":"教材对温溜写作直刺。浅刺或点刺出血是商阳，向上斜刺是臂臑，斜刺或平刺是迎香。"},{"id":"LI-xialian-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"下廉","term":"","stem":"下廉的定位是？","options":["在前臂后外侧，肘横纹下4寸，阳溪（LI5）与曲池（LI11）连线上。","在前臂后外侧，肘横纹下3寸，阳溪（LI5）与曲池（LI11）连线上。","在前臂后外侧，肘横纹下2寸，阳溪（LI5）与曲池（LI11）连线上。","在前臂后外侧，腕背侧远端横纹上5寸，阳溪（LI5）与曲池（LI11）连线上。"],"answer":0,"explain":"国标还注明：此即阳溪与曲池连线上1/3与下2/3的交点，也就是上廉下1寸。上廉在肘下3寸，手三里在肘下2寸，温溜在腕上5寸。下廉虽名为「下」，其实比上廉更靠近手腕。"},{"id":"LI-xialian-ind","type":"主治","meridian":"手阳明大肠经","point":"下廉","term":"","stem":"下廉的主治主要是？","options":["头痛、眩晕、目痛、腹胀腹痛、肘臂痛","鼻塞、鼽衄","肩痛不举、瘾疹","暴喑、瘿气"],"answer":0,"explain":"下廉以头目、腹部病和局部肘臂痛为常考点，不要把上廉的半身不遂或手三里的齿痛颊肿原样抄过来。"},{"id":"LI-xialian-op","type":"操作考点","meridian":"手阳明大肠经","point":"下廉","term":"","stem":"下廉常用的刺法是？","options":["直刺","浅刺或点刺出血为主","直刺或向下斜刺，取穴时臂外展","须避开颈动脉"],"answer":0,"explain":"下廉、上廉教材都写直刺。向下斜刺是肩髃，避开颈动脉是扶突等颈部穴。"},{"id":"LI-shanglian-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"上廉","term":"","stem":"上廉的定位是？","options":["在前臂后外侧，肘横纹下3寸，阳溪（LI5）与曲池（LI11）连线上。","在前臂后外侧，肘横纹下4寸，阳溪（LI5）与曲池（LI11）连线上。","在前臂后外侧，肘横纹下2寸，阳溪（LI5）与曲池（LI11）连线上。","在臂外侧，肘横纹上3寸，曲池（LI11）与肩髃（LI15）连线上。"],"answer":0,"explain":"上廉在肘下3寸，下廉在肘下4寸，手三里在肘下2寸，手五里在肘上3寸。"},{"id":"LI-shanglian-ind","type":"主治","meridian":"手阳明大肠经","point":"上廉","term":"","stem":"上廉的主治主要是？","options":["手臂麻木、肩膊酸痛、半身不遂，以及肠鸣腹痛","齿痛、颊肿","热病、昏迷","鼻塞、鼽衄"],"answer":0,"explain":"上廉以肩臂、上肢病和肠鸣腹痛为常考点。齿痛颊肿更常考手三里。"},{"id":"LI-shanglian-op","type":"操作考点","meridian":"手阳明大肠经","point":"上廉","term":"","stem":"上廉常用的刺法是？","options":["直刺","浅刺或点刺出血为主","向上斜刺为主","斜刺或平刺为主"],"answer":0,"explain":"教材对上廉写作直刺。浅刺或点刺出血是商阳，向上斜刺是臂臑，斜刺或平刺是迎香。与下廉相同，定位不要据此混淆。"},{"id":"LI-sanli-loc-cmp","type":"定位文字题","meridian":"手阳明大肠经","point":"下廉","term":"","stem":"在阳溪与曲池连线上，肘横纹下2寸、3寸、4寸分别是？","options":["手三里、上廉、下廉","手三里、下廉、上廉","上廉、下廉、手三里","下廉、上廉、手三里"],"answer":0,"explain":"手三里最近肘（肘下2寸），上廉在肘下3寸，下廉在肘下4寸、更靠近手腕。名称中的「上」「下」不要按离肘的远近想反。"},{"id":"LI-shousanli-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"手三里","term":"","stem":"手三里的定位是？","options":["在前臂后外侧，肘横纹下2寸，阳溪（LI5）与曲池（LI11）连线上。","在前臂后外侧，肘横纹下3寸，阳溪（LI5）与曲池（LI11）连线上。","在小腿外侧，犊鼻（ST35）下3寸，犊鼻（ST35）与解溪（ST41）连线上。","在臂外侧，肘横纹上2寸，曲池（LI11）与肩髃（LI15）连线上。"],"answer":0,"explain":"上廉在肘下3寸。犊鼻下3寸是足三里，不要把手三里和足三里的定位弄混。"},{"id":"LI-shousanli-mix","type":"定位文字题","meridian":"手阳明大肠经","point":"手三里","term":"","stem":"手三里与足三里最重要的区别是？","options":["手三里在肘横纹下2寸，属大肠经；足三里在犊鼻下3寸，属胃经，还是合穴和胃下合穴","二者定位相同，只是左右不同","手三里是合穴，足三里不是","足三里在大肠经，手三里在胃经"],"answer":0,"explain":"手三里不是合穴。合穴、胃下合穴都是足三里。"},{"id":"LI-shousanli-ind","type":"主治","meridian":"手阳明大肠经","point":"手三里","term":"","stem":"手三里的主治主要是？","options":["齿痛、颊肿，上肢不遂，腹痛、腹泻","头痛、项强为主","无脉症","月经不调"],"answer":0,"explain":"手三里既是上肢病常用穴，也治腹痛腹泻，并常考齿痛、颊肿。"},{"id":"LI-shousanli-op","type":"操作考点","meridian":"手阳明大肠经","point":"手三里","term":"","stem":"手三里常用的刺法是？","options":["直刺","浅刺或点刺出血为主","向上斜刺为主","斜刺或平刺为主"],"answer":0,"explain":"教材对手三里写作直刺。浅刺或点刺出血是商阳，向上斜刺是臂臑，斜刺或平刺是迎香。前臂的温溜、下廉、上廉、手三里都写直刺。"},{"id":"LI-shousanli-combo","type":"配伍题","meridian":"手阳明大肠经","point":"手三里","term":"","stem":"上肢不遂，手三里常配哪个穴？","options":["曲池","太渊","迎香","内庭"],"answer":0,"explain":"手三里配曲池，是教材常列的上肢不遂配伍。"},{"id":"LI-bone-12","type":"名词题","meridian":"手阳明大肠经","point":"上廉","term":"骨度分寸","stem":"阳溪至曲池的骨度是？","options":["12寸","9寸","8寸","10寸"],"answer":0,"explain":"前臂阳溪到曲池折作12寸，所以偏历在腕上3寸，温溜在腕上5寸，手三里、上廉、下廉分别在肘下2、3、4寸。"},{"id":"LI-quchi-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"曲池","term":"","stem":"曲池的定位是？","options":["在肘外侧，尺泽（LU5）与肱骨外上髁连线的中点处。","在肘横纹上，肱二头肌腱桡侧缘凹陷中。","在肘横纹上，肱二头肌腱尺侧缘凹陷中。","在肘后外侧，肱骨外上髁上缘，髁上嵴的前缘。"],"answer":0,"explain":"国标原文如此。注：屈肘90°，约在肘横纹外侧端外凹陷中。尺泽在肱二头肌腱桡侧，曲泽在尺侧；肘髎在肱骨外上髁上缘。教材常写成屈肘、肘横纹外侧端，与国标为同一部位。"},{"id":"LI-quchi-pose","type":"操作考点","meridian":"手阳明大肠经","point":"曲池","term":"","stem":"取曲池时常用的体位是？","options":["屈肘取穴","拇指充分外展后伸","臂外展或向前平伸","微握拳"],"answer":0,"explain":"曲池须屈肘取穴。拇指外展后伸是取阳溪，臂外展或平伸是取肩髃，微握拳常用于取二间、三间。"},{"id":"LI-quchi-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"曲池","term":"五输穴","stem":"曲池是大肠经的？","options":["合穴，五行属土，也是母穴","经穴，五行属火","井穴，五行属金，也是本穴","荥穴，五行属水，也是子穴"],"answer":0,"explain":"阳经合穴属土。大肠属金，虚则补其母，故曲池是母穴。本穴是商阳，子穴是二间。曲池不是大肠下合穴，下合穴是上巨虚。"},{"id":"LI-quchi-ind","type":"主治","meridian":"手阳明大肠经","point":"曲池","term":"","stem":"曲池较有特点的主治是？","options":["热病、瘾疹湿疹等皮肤病、上肢不遂，以及咽喉肿痛、齿痛目赤、高血压","只治疗局部肘痛","无脉症","痔疾"],"answer":0,"explain":"曲池是清热、治皮肤病和上肢不遂的要穴，也常用于五官热证、腹痛吐泻、高血压和癫狂。"},{"id":"LI-quchi-skin","type":"主治","meridian":"手阳明大肠经","point":"曲池","term":"","stem":"瘾疹、湿疹等皮肤病，大肠经最常选取的要穴是？","options":["曲池","商阳","偏历","口禾髎"],"answer":0,"explain":"曲池是本经治疗皮肤病的要穴，肩髃也常考瘾疹，但皮肤病首选多先记曲池。"},{"id":"LI-quchi-op","type":"操作考点","meridian":"手阳明大肠经","point":"曲池","term":"","stem":"关于曲池的操作，下列哪项正确？","options":["屈肘取穴，常用直刺","常点刺出血","孕妇禁针","须避开桡侧副动脉后再刺"],"answer":0,"explain":"曲池屈肘取穴，常用直刺。各书深度写法有出入，本题只考刺法，不考具体寸数。孕妇禁针是合谷，避开动脉是手五里。"},{"id":"LI-quchi-hegu","type":"配伍题","meridian":"手阳明大肠经","point":"曲池","term":"","stem":"热病、头面热证或皮肤病，曲池常配哪个穴？","options":["合谷","太渊","列缺","内关"],"answer":0,"explain":"曲池与合谷同属大肠经，二穴常配用于清热，以及头面、皮肤病。"},{"id":"LI-quchi-xuehai","type":"配伍题","meridian":"手阳明大肠经","point":"曲池","term":"","stem":"瘾疹等皮肤病，曲池常配哪个穴？","options":["血海","迎香","太渊","商阳"],"answer":0,"explain":"教材常列曲池配血海，或再配足三里、合谷，用于瘾疹等皮肤病。"},{"id":"LI-quchi-mix","type":"定位文字题","meridian":"手阳明大肠经","point":"曲池","term":"","stem":"屈肘时，尺泽、曲池、少海的相对位置是？","options":["尺泽在肱二头肌腱桡侧，曲池在尺泽与肱骨外上髁连线中点，少海在肘横纹内侧端","曲池在肱二头肌腱桡侧，尺泽在肱骨外上髁前方","少海就是曲池的别名","三者都在肱骨外上髁前方"],"answer":0,"explain":"尺泽是肺经合穴，在肌腱桡侧；曲池在肘外侧；少海是心经合穴，在肘内侧。小海则在尺骨鹰嘴与肱骨内上髁之间，属小肠经，也不要和曲池弄混。"},{"id":"LI-zhouliao-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"肘髎","term":"","stem":"肘髎的定位是？","options":["在肘后外侧，肱骨外上髁上缘，髁上嵴的前缘。","在肘外侧，尺泽（LU5）与肱骨外上髁连线的中点处。","在臂外侧，肘横纹上3寸，曲池（LI11）与肩髃（LI15）连线上。","在前臂后外侧，肘横纹下2寸，阳溪（LI5）与曲池（LI11）连线上。"],"answer":0,"explain":"国标原文如此。教材常写成屈肘、曲池上方1寸、当肱骨边缘处，与国标为同一部位。曲池在尺泽与肱骨外上髁连线中点，手五里在肘上3寸。"},{"id":"LI-zhouliao-ind","type":"主治","meridian":"手阳明大肠经","point":"肘髎","term":"","stem":"肘髎的主治主要是？","options":["肘臂酸痛、麻木、挛急","齿痛、鼻衄","热病、昏迷","腹胀、泄泻"],"answer":0,"explain":"肘髎以局部肘臂病为主。"},{"id":"LI-zhouliao-op","type":"操作考点","meridian":"手阳明大肠经","point":"肘髎","term":"","stem":"肘髎常用的刺法是？","options":["直刺","浅刺或点刺出血为主","斜刺或平刺为主","直刺或向下斜刺，取穴时臂外展"],"answer":0,"explain":"教材写肘髎直刺。"},{"id":"LI-zhouliao-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"肘髎","term":"","stem":"关于肘髎，下列哪项正确？","options":["它没有五输、原络郄募等特定穴属性","它是大肠经合穴","它是大肠经郄穴","它是大肠经原穴"],"answer":0,"explain":"合穴是曲池，郄穴是温溜，原穴是合谷。"},{"id":"LI-shouwuli-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"手五里","term":"","stem":"手五里的定位是？","options":["在臂外侧，肘横纹上3寸，曲池（LI11）与肩髃（LI15）连线上。","在前臂后外侧，肘横纹下3寸，阳溪（LI5）与曲池（LI11）连线上。","在臂外侧，在曲池（LI11）与肩髃（LI15）连线上，三角肌前缘处。","在前臂后外侧，腕背侧远端横纹上5寸，阳溪（LI5）与曲池（LI11）连线上。"],"answer":0,"explain":"上廉在肘下3寸，臂臑在同一连线上、三角肌前缘（约曲池上7寸），温溜在腕上5寸。"},{"id":"LI-shouwuli-ind","type":"主治","meridian":"手阳明大肠经","point":"手五里","term":"","stem":"手五里的主治主要是？","options":["肘臂挛痛、瘰疬","齿痛、目赤","肠鸣、泄泻","头痛、项强"],"answer":0,"explain":"手五里以肘臂挛痛和瘰疬为常考点。"},{"id":"LI-shouwuli-op","type":"操作考点","meridian":"手阳明大肠经","point":"手五里","term":"","stem":"手五里操作时最应注意的是？","options":["避开动脉，直刺","常规点刺出血","孕妇禁针","向内上方斜刺或平刺"],"answer":0,"explain":"手五里深层有动脉，教材要求避开动脉后直刺。古代有禁刺、多灸的记载，通行教材已改为避开动脉可刺，不要再把「绝对禁针」当作标准答案。"},{"id":"LI-shouwuli-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"手五里","term":"","stem":"关于手五里，下列哪项正确？","options":["它没有五输、原络郄募等特定穴属性","它是大肠经络穴","它是八脉交会穴","它是大肠下合穴"],"answer":0,"explain":"络穴是偏历，大肠下合穴是上巨虚。手五里不是特定穴。"},{"id":"LI-binao-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"臂臑","term":"","stem":"臂臑的定位是？","options":["在臂外侧，在曲池（LI11）与肩髃（LI15）连线上，三角肌前缘处。","在臂外侧，肘横纹上3寸，曲池（LI11）与肩髃（LI15）连线上。","在肩带部，肩峰外侧缘前端与肱骨大结节两骨间凹陷中。","在肩带部，锁骨肩峰端与肩胛冈之间凹陷中。"],"answer":0,"explain":"国标注：约在曲池上7寸、三角肌前缘。手五里在肘上3寸，肩髃在肩峰前下方，巨骨在锁骨肩峰端与肩胛冈之间。"},{"id":"LI-binao-ind","type":"主治","meridian":"手阳明大肠经","point":"臂臑","term":"","stem":"臂臑较有特点的主治是？","options":["肩臂痛、颈项拘急、瘰疬，以及目疾","鼻塞、鼽衄","肠鸣、泄泻","热病、昏迷"],"answer":0,"explain":"臂臑除肩臂痛、瘰疬外，还常考目疾。"},{"id":"LI-binao-op","type":"操作考点","meridian":"手阳明大肠经","point":"臂臑","term":"","stem":"臂臑常用的刺法是？","options":["直刺或向上斜刺","直刺或向下斜刺","浅刺或点刺出血","斜刺或平刺"],"answer":0,"explain":"臂臑在三角肌前缘，教材写直刺或向上斜刺。向下斜刺是肩髃，不要把方向记反。"},{"id":"LI-binao-combo","type":"配伍题","meridian":"手阳明大肠经","point":"臂臑","term":"","stem":"目疾，臂臑常配哪个穴？","options":["光明","太渊","天枢","内庭"],"answer":0,"explain":"教材常列臂臑配光明治目疾。"},{"id":"LI-binao-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"臂臑","term":"","stem":"关于臂臑，下列哪项正确？","options":["它没有五输、原络郄募等特定穴属性","它是大肠经合穴","它是大肠经郄穴","它是手足阳明交会穴"],"answer":0,"explain":"合穴是曲池，郄穴是温溜，手足阳明交会穴是迎香。部分文献还讨论臂臑的交会属性，通行教材穴下不以交会穴作为必记标签，本题不强行归类。"},{"id":"LI-jianyu-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"肩髃","term":"","stem":"肩髃的定位是？","options":["在肩带部，肩峰外侧缘前端与肱骨大结节两骨间凹陷中。","在肩带部，锁骨肩峰端与肩胛冈之间凹陷中。","在肩带部，肩峰外侧缘后端与肱骨大结节之间凹陷中。","在臂外侧，在曲池（LI11）与肩髃（LI15）连线上，三角肌前缘处。"],"answer":0,"explain":"国标注：屈臂外展时，肩峰外侧缘前后端呈现两个凹陷，前一个较深是肩髃，后一个是三焦经肩髎。巨骨在锁骨肩峰端与肩胛冈之间。"},{"id":"LI-jianyu-mix","type":"定位文字题","meridian":"手阳明大肠经","point":"肩髃","term":"","stem":"臂外展时，肩峰外侧缘前、后两个凹陷分别是？","options":["前面较深的是肩髃，后面的是肩髎","前面是肩髎，后面是肩髃","前面是巨骨，后面是肩髃","两个凹陷都是肩髃"],"answer":0,"explain":"这是肩髃与肩髎最常用的对比。巨骨不在这两个凹陷里，而在锁骨肩峰端与肩胛冈之间。"},{"id":"LI-jianyu-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"肩髃","term":"交会穴","stem":"肩髃是哪两条经脉的交会穴？","options":["手阳明与阳跷脉","手足阳明","手阳明与阳维脉","手阳明与手太阳"],"answer":0,"explain":"肩髃、巨骨都是手阳明与阳跷脉的交会穴。手足阳明交会穴是迎香。"},{"id":"LI-jianyu-ind","type":"主治","meridian":"手阳明大肠经","point":"肩髃","term":"","stem":"肩髃较有特点的主治是？","options":["肩臂挛痛、上肢不遂，以及瘾疹","齿痛、鼻衄","肠鸣、便秘","头痛、耳聋"],"answer":0,"explain":"肩髃是治肩和上肢不遂的要穴，也常考瘾疹。"},{"id":"LI-jianyu-op","type":"操作考点","meridian":"手阳明大肠经","point":"肩髃","term":"","stem":"肩髃常用的刺法是？","options":["直刺或向下斜刺","直刺或向上斜刺","浅刺或点刺出血","斜刺或平刺"],"answer":0,"explain":"教材写肩髃直刺或向下斜刺。向上斜刺是臂臑。取穴时常臂外展或向前平伸。有的教材补充：肩周炎宜向肩关节直刺，上肢不遂宜向三角肌方向斜刺，都只作为方向考点。"},{"id":"LI-jianyu-pose","type":"操作考点","meridian":"手阳明大肠经","point":"肩髃","term":"","stem":"取肩髃时常用的体位是？","options":["臂外展或向前平伸","屈肘成直角","拇指充分外展后伸","头转向对侧"],"answer":0,"explain":"臂外展或平伸时，肩峰前下方凹陷显现，便于取肩髃。屈肘是取曲池，拇指外展后伸是取阳溪。"},{"id":"LI-jugu-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"巨骨","term":"","stem":"巨骨的定位是？","options":["在肩带部，锁骨肩峰端与肩胛冈之间凹陷中。","在肩带部，肩峰外侧缘前端与肱骨大结节两骨间凹陷中。","在前胸部，锁骨下窝凹陷中，喙突内缘。","在颈前部，横平甲状软骨上缘，胸锁乳突肌前、后缘中间。"],"answer":0,"explain":"国标注：即冈上窝外端两骨间凹陷中。肩髃在肩峰前下方，云门在锁骨下窝，扶突在胸锁乳突肌中间、横平喉结。"},{"id":"LI-jugu-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"巨骨","term":"交会穴","stem":"巨骨是哪两条经脉的交会穴？","options":["手阳明与阳跷脉","手足阳明","手阳明与督脉","手阳明与手少阳"],"answer":0,"explain":"巨骨与肩髃都是手阳明、阳跷脉交会穴。"},{"id":"LI-jugu-ind","type":"主治","meridian":"手阳明大肠经","point":"巨骨","term":"","stem":"巨骨的主治主要是？","options":["肩臂挛痛不遂，以及瘰疬、瘿气","齿痛、目赤","腹痛、泄泻","热病、昏迷"],"answer":0,"explain":"巨骨以肩臂病和瘰疬、瘿气为常考点。"},{"id":"LI-jugu-op","type":"操作考点","meridian":"手阳明大肠经","point":"巨骨","term":"","stem":"巨骨常用的刺法是？","options":["直刺，微斜向外下方，不可深刺","直刺或向下斜刺","直刺或向上斜刺","斜刺或平刺"],"answer":0,"explain":"教材写巨骨直刺、微斜向外下方，须掌握方向与深度。不要写成肩髃那样向下斜刺或臂臑那样向上斜刺。"},{"id":"LI-tianding-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"天鼎","term":"","stem":"天鼎的定位是？","options":["在颈前部，横平环状软骨，胸锁乳突肌后缘。","在颈前部，横平甲状软骨上缘（约相当于喉结处），胸锁乳突肌前、后缘中间。","在颈前部，横平环状软骨，胸锁乳突肌前缘。","在颈前部，横平甲状软骨上缘，胸锁乳突肌前缘，颈总动脉搏动处。"],"answer":0,"explain":"国标原文如此，注：扶突直下，横平水突。扶突横平喉结、在胸锁乳突肌中间；同一水平前缘是人迎，后缘是天窗。水突与天鼎相平，但在胸锁乳突肌前缘。教材有时写成扶突与缺盆连线中点，与国标为同一部位。"},{"id":"LI-tianding-ind","type":"主治","meridian":"手阳明大肠经","point":"天鼎","term":"","stem":"天鼎的主治主要是？","options":["咽喉肿痛、暴喑，以及瘰疬、瘿气","肩痛不举","肠鸣、泄泻","目赤肿痛"],"answer":0,"explain":"天鼎以暴喑、咽喉肿痛和瘰疬、瘿气为常考点。"},{"id":"LI-tianding-op","type":"操作考点","meridian":"手阳明大肠经","point":"天鼎","term":"","stem":"关于天鼎的操作，下列哪项正确？","options":["位于颈部，常用直刺，不可深刺","常规点刺出血","孕妇禁针","须避开足背动脉"],"answer":0,"explain":"天鼎在胸锁乳突肌后缘，邻近颈部重要结构，通行教材作直刺，并须控制深度。深度具体数字各书略有出入，本题只考「直刺、不可深刺」。孕妇禁针是合谷。"},{"id":"LI-tianding-combo","type":"配伍题","meridian":"手阳明大肠经","point":"天鼎","term":"","stem":"咽喉肿痛，天鼎常配哪个穴？","options":["少商","太渊","上巨虚","血海"],"answer":0,"explain":"教材常列天鼎配少商治咽喉肿痛；瘿气则可配合谷。"},{"id":"LI-futu-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"扶突","term":"","stem":"扶突的定位是？","options":["在颈前部，横平甲状软骨上缘（约相当于喉结处），胸锁乳突肌前、后缘中间。","在颈前部，横平甲状软骨上缘（约相当于喉结处），胸锁乳突肌前缘，颈总动脉搏动处。","在颈前部，横平甲状软骨上缘，胸锁乳突肌后缘。","在颈前部，横平环状软骨，胸锁乳突肌后缘。"],"answer":0,"explain":"同一水平：胸锁乳突肌前缘是人迎，中间是扶突，后缘是天窗。天鼎在扶突直下、横平环状软骨。"},{"id":"LI-futu-mix","type":"定位文字题","meridian":"手阳明大肠经","point":"扶突","term":"","stem":"横平喉结时，胸锁乳突肌前缘、肌腹中间、后缘分别是？","options":["人迎、扶突、天窗","扶突、人迎、天窗","人迎、天鼎、天窗","水突、扶突、天鼎"],"answer":0,"explain":"这是人迎、扶突、天窗的相对位置，常放在一起考。天鼎、水突则横平环状软骨，分别在胸锁乳突肌后缘和前缘。"},{"id":"LI-futu-ind","type":"主治","meridian":"手阳明大肠经","point":"扶突","term":"","stem":"扶突的主治主要是？","options":["咳嗽气喘、咽喉肿痛、暴喑，以及瘰疬、瘿气","上肢不遂","腹痛、便秘","头痛、目眩"],"answer":0,"explain":"扶突以咽喉、暴喑、瘿气为主，也常考咳嗽气喘。"},{"id":"LI-futu-op","type":"操作考点","meridian":"手阳明大肠经","point":"扶突","term":"","stem":"关于扶突的操作，下列哪项正确？","options":["直刺，避开动脉，不可深刺","浅刺或点刺出血","直刺深刺，不必避开动脉","斜刺或平刺，并禁针"],"answer":0,"explain":"扶突在颈部，邻近动脉等重要结构，教材写直刺，考试常补一句避开动脉、不可深刺。"},{"id":"LI-futu-safe","type":"安全考点","meridian":"手阳明大肠经","point":"扶突","term":"","stem":"取天鼎、扶突时应注意？","options":["二穴都在颈部，须谨慎取穴，避开动脉，不可深刺","二穴都要避开桡动脉","二穴只用作定位标志，不针刺","二穴与合谷一样，孕妇当首选"],"answer":0,"explain":"这是颈部穴的安全考点，只记须谨慎、避开动脉、不可深刺，不写具体进针步骤。"},{"id":"LI-futu-combo","type":"配伍题","meridian":"手阳明大肠经","point":"扶突","term":"","stem":"瘿气，扶突或天鼎常配哪个穴？","options":["合谷","太渊","血海","内庭"],"answer":0,"explain":"教材常列扶突或天鼎配合谷治瘿气。"},{"id":"LI-kouheliao-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"口禾髎","term":"","stem":"口禾髎的定位是？","options":["在面部，横平人中沟上1/3与下2/3交点，鼻孔外缘直下。","在面部，鼻翼外缘中点旁，鼻唇沟中。","在面部，口角旁开0.4寸。","在面部，横平鼻翼下缘，瞳孔直下。"],"answer":0,"explain":"国标原文如此，注：水沟旁开0.5寸。教材常写成鼻孔外缘直下、平水沟穴，与国标为同一部位。迎香在鼻翼外缘中点旁、鼻唇沟中，地仓在口角旁，巨髎在瞳孔直下平鼻翼下缘。"},{"id":"LI-kouheliao-mix","type":"定位文字题","meridian":"手阳明大肠经","point":"口禾髎","term":"","stem":"口禾髎与迎香、水沟的位置关系是？","options":["口禾髎在鼻孔外缘直下、约平水沟，迎香在其上方、鼻翼外缘中点旁的鼻唇沟中","迎香平水沟，口禾髎在鼻翼旁","口禾髎在口角旁，迎香平水沟","三穴位置相同，只是所属经脉不同"],"answer":0,"explain":"水沟在人中沟，口禾髎在其旁、鼻孔外缘直下；迎香更高，在鼻翼旁鼻唇沟中。"},{"id":"LI-kouheliao-ind","type":"主治","meridian":"手阳明大肠经","point":"口禾髎","term":"","stem":"口禾髎的主治主要是？","options":["鼻塞、鼽衄，以及口喎、口噤","肩臂痛","肠鸣、泄泻","热病、昏迷"],"answer":0,"explain":"口禾髎以鼻病和口喎、口噤为常考点。"},{"id":"LI-kouheliao-op","type":"操作考点","meridian":"手阳明大肠经","point":"口禾髎","term":"","stem":"口禾髎常用的刺法是？","options":["直刺或斜刺","浅刺或点刺出血","直刺深刺","直刺或向下斜刺，取穴时臂外展"],"answer":0,"explain":"教材写口禾髎直刺或斜刺，面部不可深刺。迎香则多作斜刺或平刺。"},{"id":"LI-kouheliao-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"口禾髎","term":"","stem":"关于口禾髎，下列哪项正确？","options":["它没有五输、原络郄募等特定穴属性","它是手足阳明交会穴","它是大肠经原穴","它是八脉交会穴"],"answer":0,"explain":"手足阳明交会穴是迎香，原穴是合谷。口禾髎不是特定穴。"},{"id":"LI-yingxiang-loc","type":"定位文字题","meridian":"手阳明大肠经","point":"迎香","term":"","stem":"迎香的定位是？","options":["在面部，鼻翼外缘中点旁，鼻唇沟中。","在面部，横平人中沟上1/3与下2/3交点，鼻孔外缘直下。","在面部，口角旁开0.4寸。","在面部，眼球与眶下缘之间，瞳孔直下。"],"answer":0,"explain":"口禾髎在鼻孔外缘直下、平水沟，地仓在口角旁，承泣在瞳孔直下、眼球与眶下缘之间。"},{"id":"LI-yingxiang-spec","type":"特定穴归类","meridian":"手阳明大肠经","point":"迎香","term":"交会穴","stem":"迎香是哪两条经的交会穴？","options":["手足阳明经","手阳明与阳跷脉","手足太阳经","手阳明与督脉"],"answer":0,"explain":"迎香是大肠经止穴，也是手足阳明的交会穴，胃经从这里接下去。"},{"id":"LI-yingxiang-ind","type":"主治","meridian":"手阳明大肠经","point":"迎香","term":"","stem":"迎香较有特点的主治是？","options":["鼻塞、鼽衄、口喎、面痒，以及胆道蛔虫症","上肢不遂","肠鸣、痢疾","月经不调"],"answer":0,"explain":"迎香是通鼻窍的要穴，也常考口喎、面痒和胆道蛔虫症。"},{"id":"LI-yingxiang-op","type":"操作考点","meridian":"手阳明大肠经","point":"迎香","term":"","stem":"迎香常用的刺法是？","options":["斜刺或平刺","浅刺或点刺出血","直刺深刺","直刺，微斜向外下方"],"answer":0,"explain":"通行教材写迎香斜刺或平刺，也有写作略向内上方斜刺或平刺。近目，须掌握方向与深度，不写逐步进针。"},{"id":"LI-yingxiang-moxa","type":"操作考点","meridian":"手阳明大肠经","point":"迎香","term":"","stem":"关于迎香的灸法，通行教材的说法是？","options":["《外台》记载不宜灸；部分教材直接写作禁灸","与合谷一样，孕妇首选此穴施灸","只灸不针","必须用瘢痕灸"],"answer":0,"explain":"《针灸学》附注引《外台》：不宜灸。也有教材或参考书直接写禁灸。两种表述都是不宜施灸，不要把「禁灸」和「不宜灸」做成互斥的对错项。"},{"id":"LI-yingxiang-combo","type":"配伍题","meridian":"手阳明大肠经","point":"迎香","term":"","stem":"鼻塞、鼽衄，迎香常配哪个穴？","options":["合谷","足三里","太渊","内关"],"answer":0,"explain":"迎香配大肠经原穴合谷，是治疗鼻病的常用配伍，「面口合谷收」。"},{"id":"LI-seq-20","type":"名词题","meridian":"手阳明大肠经","point":"","term":"腧穴顺序","stem":"手阳明大肠经体表20穴的起止顺序，起于商阳之后、止于迎香之前，最后四穴是？","options":["天鼎、扶突、口禾髎、迎香","扶突、天鼎、口禾髎、迎香","天鼎、扶突、迎香、口禾髎","巨骨、扶突、天鼎、迎香"],"answer":0,"explain":"本经20穴顺序：商阳、二间、三间、合谷、阳溪、偏历、温溜、下廉、上廉、手三里、曲池、肘髎、手五里、臂臑、肩髃、巨骨、天鼎、扶突、口禾髎、迎香。最后四穴不要把天鼎和扶突、口禾髎和迎香写反。"},{"id":"LI-course-start","type":"循行","meridian":"手阳明大肠经","point":"商阳","term":"","stem":"手阳明大肠经起于何处？","options":["食指桡侧末端（商阳）","中焦","鼻翼旁（迎香）","拇指桡侧末端（少商）"],"answer":0,"explain":"大肠经从商阳起始。肺经循行「起于中焦」，体表从中府开始；不要把两条经的起点写混。拇指端是少商。迎香是本经止穴。"},{"id":"LI-course-end","type":"循行","meridian":"手阳明大肠经","point":"迎香","term":"","stem":"大肠经体表止于哪一穴，并交于哪一条经？","options":["迎香，交足阳明胃经","口禾髎，交督脉","迎香，交手太阴肺经","商阳，交足阳明胃经"],"answer":0,"explain":"体表起于商阳、止于迎香，在迎香交足阳明胃经。与肺经的衔接是在流注和表里络属上，不是在迎香相交。"},{"id":"LI-course-zangfu","type":"循行","meridian":"手阳明大肠经","point":"","term":"表里经","stem":"大肠经的属络关系是？","options":["属大肠，络肺","属肺，络大肠","属大肠，络胃","属大肠，络脾"],"answer":0,"explain":"肺与大肠相表里，本经入缺盆后络肺、下膈、属大肠。"},{"id":"LI-course-face","type":"循行","meridian":"手阳明大肠经","point":"迎香","term":"","stem":"大肠经在面部的走行特点是？","options":["入下齿中，还出挟口，交人中，左之右、右之左，上挟鼻孔","入上齿中，环绕口唇","直上到目内眦，交睛明","从耳后进入耳中"],"answer":0,"explain":"入下齿、交人中而左右交叉，上挟鼻孔止于对侧迎香，是大肠经面部循行的要点。入上齿的是胃经。"},{"id":"LI-course-dazhui","type":"循行","meridian":"手阳明大肠经","point":"","term":"","stem":"大肠经在肩颈部「上出于柱骨之会上」，通常是指会于？","options":["大椎","风府","百会","膻中"],"answer":0,"explain":"「柱骨之会上」通行教材指诸阳会于大椎。不要写成百会或风府。"},{"id":"LI-course-hour","type":"循行","meridian":"手阳明大肠经","point":"","term":"","stem":"十二经气流注中，大肠经在哪个时辰？","options":["卯时","寅时","辰时","巳时"],"answer":0,"explain":"寅时流注肺经，卯时接着流注大肠经，辰时再接胃经。"},{"id":"LI-course-rule","type":"主治","meridian":"手阳明大肠经","point":"","term":"","stem":"手阳明大肠经腧穴的主治规律是？","options":["头面、五官、咽喉病，热病，以及循行部位病证","仅治疗大肠腑病","以神志病为主","以胸肺病为主"],"answer":0,"explain":"本经既治头面五官和热病，也治本腑及上肢肩臂等循行部位病证。"},{"id":"LI-course-isdong","type":"循行","meridian":"手阳明大肠经","point":"","term":"是动病","stem":"大肠经「是动则病」的病候是？","options":["齿痛、颈肿","肺胀喘咳、缺盆中痛","贲响腹胀、善伸数欠","掌中热"],"answer":0,"explain":"《灵枢·经脉》：「是动则病齿痛、颈肿。」肺胀喘咳是肺经是动病的内容，不要记串。"},{"id":"LI-course-suosheng","type":"循行","meridian":"手阳明大肠经","point":"","term":"所生病","stem":"大肠经「是主津所生病」的常见病候是？","options":["目黄、口干、鼽衄、喉痹、肩前臑痛、大指次指痛不用","狂疟温淫、汗出、口喎、唇胗","胸满、喘咳、缺盆中痛","黄疸、疟疾、膝股内侧痛"],"answer":0,"explain":"经文亦作「是主津液所生病者」。气有余则脉所过处热肿，虚则寒栗不复。狂疟、口喎、唇胗是胃经所生病的内容。"},{"id":"LI-course-xushi","type":"循行","meridian":"手阳明大肠经","point":"","term":"是动病","stem":"大肠经气有余与气虚时，经文所说的表现分别是？","options":["气有余则脉所过者热肿，虚则寒栗不复","气有余则身以前皆热，虚则身以前皆寒栗","气有余则喘咳，虚则少气不足以息","气有余则遗尿，虚则闭癃"],"answer":0,"explain":"「身以前皆热」是胃经的表述。大肠经只记热肿与寒栗不复。"},{"id":"LI-course-luo","type":"循行","meridian":"手阳明大肠经","point":"偏历","term":"络脉病候","stem":"大肠经别络（偏历）的病候，经文所说是？","options":["实则龋、聋，虚则齿寒、痹隔","实则寸口大三倍于人迎，虚则掌中热","实则肩臂热肿，虚则口喎","实则水肿，虚则无脉"],"answer":0,"explain":"《灵枢·经脉》大肠别络：实则龋聋，虚则齿寒痹隔。这是络脉病候，不要和是动、所生病混记。"},{"id":"LI-term-yangwu","type":"特定穴归类","meridian":"手阳明大肠经","point":"","term":"五输穴","stem":"大肠经五输穴从井到合的顺序是？","options":["商阳、二间、三间、阳溪、曲池","商阳、二间、合谷、阳溪、曲池","商阳、三间、二间、阳溪、曲池","商阳、二间、三间、偏历、曲池"],"answer":0,"explain":"井荥输经合是商阳、二间、三间、阳溪、曲池。合谷是原穴，夹在三间与阳溪之间，但不算五输穴。"},{"id":"LI-term-yangyuan","type":"名词题","meridian":"手阳明大肠经","point":"合谷","term":"阳经输原分穴","stem":"大肠经的输穴和原穴分别是？","options":["三间、合谷","合谷、三间","二间、合谷","合谷、偏历"],"answer":0,"explain":"阳经在输穴之后另有原穴，所以三间是输穴、合谷是原穴。阴经才是以输代原。"},{"id":"LI-term-muzi","type":"名词题","meridian":"手阳明大肠经","point":"曲池","term":"母子补泻","stem":"大肠经虚证「虚则补其母」，应取的母穴是？","options":["曲池","商阳","二间","合谷"],"answer":0,"explain":"大肠属金，合穴曲池属土为母穴。商阳是本穴，二间是子穴，用于实则泻其子。"},{"id":"LI-term-muzi-shi","type":"名词题","meridian":"手阳明大肠经","point":"二间","term":"母子补泻","stem":"大肠经实证「实则泻其子」，应取的子穴是？","options":["二间","曲池","商阳","合谷"],"answer":0,"explain":"荥穴二间属水，金之子，故为泻子穴。不要误取合穴曲池。"},{"id":"LI-term-xiahe","type":"名词题","meridian":"手阳明大肠经","point":"","term":"下合穴","stem":"大肠的下合穴是？","options":["上巨虚","足三里","下巨虚","曲池"],"answer":0,"explain":"「合治内府」：胃合于足三里，大肠合于上巨虚，小肠合于下巨虚。上巨虚在胃经，不是大肠经穴，也不要写成曲池。"},{"id":"LI-term-mu","type":"名词题","meridian":"手阳明大肠经","point":"","term":"募穴","stem":"大肠的募穴是？","options":["天枢","中脘","中府","大肠俞"],"answer":0,"explain":"天枢是大肠募穴，在胃经上。大肠俞是背俞穴，中脘是胃募，中府是肺募。"},{"id":"LI-term-shu","type":"名词题","meridian":"手阳明大肠经","point":"","term":"背俞穴","stem":"大肠的背俞穴是？","options":["大肠俞","天枢","肺俞","上巨虚"],"answer":0,"explain":"背俞在膀胱经。天枢是募穴，上巨虚是下合穴，肺俞是肺的背俞。"},{"id":"LI-combo-yumu","type":"配伍题","meridian":"手阳明大肠经","point":"","term":"俞募配穴","stem":"天枢配大肠俞属于哪种配穴，常用于大肠腑病？","options":["俞募配穴","原络配穴","开四关","母子补泻"],"answer":0,"explain":"天枢是大肠募穴，大肠俞是背俞穴。两穴都不在大肠经上，但属于本经相关的必考点。"},{"id":"LI-combo-xiahe","type":"配伍题","meridian":"手阳明大肠经","point":"","term":"下合穴","stem":"治疗大肠腑病，上巨虚常与本经穴同用。下列哪项正确？","options":["上巨虚是大肠下合穴，在胃经，不是大肠经穴","上巨虚是大肠经合穴","上巨虚就是曲池的别名","上巨虚是大肠募穴"],"answer":0,"explain":"下合穴「合治内府」，上巨虚在胃经。合穴是曲池，募穴是天枢。"},{"id":"LI-term-duoxue","type":"名词题","meridian":"手阳明大肠经","point":"","term":"","stem":"就气血多少而言，手足阳明经的特点是？","options":["多气多血","多气少血","多血少气","少气少血"],"answer":0,"explain":"阳明经多气多血，是教材对十二经气血多少的通行说法。"},{"id":"LI-term-yuanluo-pair","type":"配伍题","meridian":"手阳明大肠经","point":"","term":"原络配穴","stem":"大肠经与肺经的原络配，正确的组合是？","options":["合谷配列缺，或太渊配偏历","合谷配太渊","合谷配太冲","曲池配列缺"],"answer":0,"explain":"本经原配表里经络，或表里经原配本经络。合谷配太渊把两个原穴配在一起，不是原络配。合谷配太冲是开四关。"},{"id":"LI-term-hegu-not-xiahe","type":"特定穴归类","meridian":"手阳明大肠经","point":"曲池","term":"下合穴","stem":"下列哪组对应完全正确？","options":["曲池是大肠经合穴，上巨虚是大肠下合穴","曲池既是合穴也是大肠下合穴","合谷是大肠下合穴","天枢是大肠下合穴"],"answer":0,"explain":"本经合穴和下合穴不是同一个穴，下合穴还在另一条经上。这是大肠经最容易考错的归类之一。"}];

iyuan-ind","type":"主治","meridian":"手太阴肺经","point":"太渊","term":"","stem":"太渊较有特点的主治是？","options":["咳嗽、气喘，无脉症，腕臂痛","急性吐泻、中暑","小儿疳积","昏迷、癫狂"],"answer":0,"explain":"太渊是脉会，所以除肺系病证外，特有主治是无脉症；也治腕臂痛。"},{"id":"LU-taiyuan-ind-why","type":"主治","meridian":"手太阴肺经","point":"太渊","term":"","stem":"太渊能治无脉症，最主要的依据是？","options":["它是八会穴中的脉会","它是肺之募穴","它是郄穴","它是八脉交会穴"],"answer":0,"explain":"八会穴中脉会太渊，故血脉病如无脉症多取太渊。"},{"id":"LU-lieque-ind","type":"主治","meridian":"手太阴肺经","point":"列缺","term":"","stem":"列缺的主治主要是？","options":["咳嗽、气喘、咽喉肿痛，以及头痛、齿痛、项强、口眼喎斜，手腕痛","无脉症","急性吐泻","瘿气"],"answer":0,"explain":"列缺是络穴，联络手阳明，能治头面颈项病，所以有「头项寻列缺」。"},{"id":"LU-kongzui-ind2","type":"主治","meridian":"手太阴肺经","point":"孔最","term":"","stem":"孔最的主治范围是？","options":["咳血、咳嗽、气喘、咽喉肿痛，肘臂挛痛，痔疾","无脉症、腕臂痛","昏迷、癫狂","肩背痛"],"answer":0,"explain":"孔最是郄穴，以咳血等血证为特点，也治肘臂挛痛和痔疾。"},{"id":"LU-chize-ind2","type":"主治","meridian":"手太阴肺经","point":"尺泽","term":"","stem":"尺泽的主治中，下列哪项不属于？","options":["无脉症","咳嗽、气喘、咳血、咽喉肿痛","急性吐泻、中暑、小儿惊风","肘臂挛痛"],"answer":0,"explain":"无脉症是太渊的主治。尺泽主治肺系病证、肘臂挛痛，以及急性吐泻、中暑、小儿惊风。"},{"id":"LU-yuji-ind2","type":"主治","meridian":"手太阴肺经","point":"鱼际","term":"","stem":"鱼际除肺系热证外，还有哪一特殊主治？","options":["小儿疳积","无脉症","瘿气","痔疾"],"answer":0,"explain":"鱼际主治咳嗽、咳血、咽干、咽喉肿痛、失音、发热，另有小儿疳积。"},{"id":"LU-shaoshang-ind2","type":"主治","meridian":"手太阴肺经","point":"少商","term":"","stem":"少商作为急救要穴，主要用于？","options":["昏迷、高热、癫狂","慢性腹泻","肩背痛","无脉症"],"answer":0,"explain":"少商是井穴，井穴多用于神志急症和热证，常点刺出血。"},{"id":"LU-tianfu-ind2","type":"主治","meridian":"手太阴肺经","point":"天府","term":"","stem":"天府的主治主要是？","options":["咳嗽、气喘、鼻衄，瘿气，上臂痛","急性吐泻","无脉症","小儿疳积"],"answer":0,"explain":"天府主治肺系病证、鼻衄、瘿气以及上臂痛。"},{"id":"LU-xiabai-ind2","type":"主治","meridian":"手太阴肺经","point":"侠白","term":"","stem":"侠白的主治中，下列哪项属于？","options":["咳嗽、气喘、干呕、上臂痛","无脉症","昏迷","痔疾"],"answer":0,"explain":"侠白主治咳嗽、气喘、干呕，以及上臂内侧痛。"},{"id":"LU-ind-xue","type":"主治","meridian":"手太阴肺经","point":"","term":"","stem":"肺经治咳血的穴中，最强调「急性咳血」的是？","options":["孔最","太渊","中府","天府"],"answer":0,"explain":"孔最是肺经郄穴，郄穴多治急症和血证，所以急性咳血首选孔最。尺泽、鱼际也治咳血。"},{"id":"LU-ind-cmp-throat","type":"主治","meridian":"手太阴肺经","point":"","term":"","stem":"肺经穴治咽喉病，偏于「点刺出血治急性咽喉肿痛」的是？","options":["少商","中府","侠白","太渊"],"answer":0,"explain":"少商是井穴，点刺出血清热利咽，常用于急性咽喉肿痛。"},{"id":"LU-ind-cmp-head","type":"主治","meridian":"手太阴肺经","point":"","term":"","stem":"下列肺经穴中，能治头痛、项强、口眼喎斜的是？","options":["列缺","鱼际","孔最","中府"],"answer":0,"explain":"列缺是络穴，联络手阳明，经气上达头面，所以能治头项面口病证。"},{"id":"LU-ind-cmp-wrist","type":"主治","meridian":"手太阴肺经","point":"","term":"","stem":"下列哪组肺经穴都可治手腕痛？","options":["列缺、经渠、太渊","中府、云门、天府","天府、侠白、尺泽","中府、孔最、少商"],"answer":0,"explain":"腕部的列缺、经渠、太渊都有局部主治手腕痛。"},{"id":"LU-ind-cmp-shoulder","type":"主治","meridian":"手太阴肺经","point":"","term":"","stem":"肺经中，能治肩背痛的胸部穴是？","options":["中府、云门","鱼际、少商","经渠、太渊","孔最、列缺"],"answer":0,"explain":"中府、云门位于胸前外上部，近肩，主治中都有肩背痛。"},{"id":"LU-ind-cmp-ying","type":"主治","meridian":"手太阴肺经","point":"","term":"","stem":"肺经中能治瘿气的是？","options":["天府","经渠","鱼际","列缺"],"answer":0,"explain":"天府主治中有瘿气、鼻衄，这是天府的特点。"},{"id":"LU-ind-gui","type":"主治","meridian":"手太阴肺经","point":"","term":"","stem":"下列主治与穴位对应完全正确的是？","options":["太渊无脉症，尺泽急性吐泻，鱼际小儿疳积","太渊小儿疳积，尺泽无脉症，鱼际急性吐泻","太渊急性吐泻，尺泽小儿疳积，鱼际无脉症","太渊瘿气，尺泽痔疾，鱼际昏迷"],"answer":0,"explain":"这三个特殊主治是肺经高频考点：太渊无脉症，尺泽急性吐泻，鱼际小儿疳积。"},{"id":"LU-loc-zf-ym","type":"定位文字题","meridian":"手太阴肺经","point":"中府","term":"","stem":"中府与云门的位置关系是？","options":["中府在云门下1寸","中府在云门上1寸","中府在云门内侧2寸","两穴同一位置"],"answer":0,"explain":"国标注：先确定云门，中府即在云门下1寸。两穴都在前正中线旁开6寸。"},{"id":"LU-loc-zf-rib","type":"定位文字题","meridian":"手太阴肺经","point":"中府","term":"","stem":"中府横平哪一肋间隙？","options":["第1肋间隙","第2肋间隙","第4肋间隙","第5肋间隙"],"answer":0,"explain":"国标：在前胸部，横平第1肋间隙，锁骨下窝外侧，前正中线旁开6寸。"},{"id":"LU-loc-ym-key","type":"定位文字题","meridian":"手太阴肺经","point":"云门","term":"","stem":"云门定位时依靠的骨性标志是？","options":["锁骨下窝、肩胛骨喙突内缘","第1肋间隙、乳头","肱骨大结节","桡骨茎突"],"answer":0,"explain":"国标：在前胸部，锁骨下窝凹陷中，肩胛骨喙突内缘，前正中线旁开6寸。"},{"id":"LU-loc-tf-xb","type":"定位文字题","meridian":"手太阴肺经","point":"天府","term":"","stem":"天府与侠白的区别是？","options":["天府在腋前纹头下3寸，侠白在腋前纹头下4寸，都在肱二头肌桡侧缘","天府在腋前纹头下4寸，侠白在下3寸","天府在肱二头肌尺侧缘，侠白在桡侧缘","两穴都在前臂"],"answer":0,"explain":"国标：天府腋前纹头下3寸，侠白腋前纹头下4寸，都在肱二头肌桡侧缘处。"},{"id":"LU-loc-tf-ratio","type":"定位文字题","meridian":"手太阴肺经","point":"天府","term":"","stem":"按国标注，天府位于肱二头肌外侧沟平腋前纹头处至尺泽连线的？","options":["上1/3与下2/3的交界处","中点","上2/3与下1/3的交界处","下1/4处"],"answer":0,"explain":"国标注原文如此。腋前纹头至肘横纹9寸，3寸正是上1/3处。"},{"id":"LU-loc-cz-qz","type":"定位文字题","meridian":"手太阴肺经","point":"尺泽","term":"","stem":"尺泽与曲泽的区别是？","options":["尺泽在肱二头肌腱桡侧缘凹陷中，曲泽在其尺侧缘凹陷中","尺泽在尺侧，曲泽在桡侧","两穴都在肱二头肌腱桡侧","尺泽在肘后，曲泽在肘前"],"answer":0,"explain":"国标：尺泽在肘横纹上，肱二头肌腱桡侧缘凹陷中；曲泽（心包经）在肱二头肌腱的尺侧缘凹陷中，二者相隔一条肌腱。"},{"id":"LU-loc-cz-qc","type":"定位文字题","meridian":"手太阴肺经","point":"尺泽","term":"","stem":"按国标注，屈肘时尺泽位于哪两穴之间？","options":["曲池与曲泽之间","曲池与少海之间","曲泽与少海之间","手三里与曲池之间"],"answer":0,"explain":"国标注：屈肘，肘横纹上，曲池与曲泽之间，与曲泽相隔一肌腱（肱二头肌腱）。"},{"id":"LU-loc-kz-mid","type":"定位文字题","meridian":"手太阴肺经","point":"孔最","term":"","stem":"按国标注，孔最在尺泽下几寸？","options":["5寸","3寸","7寸","1.5寸"],"answer":0,"explain":"国标注：尺泽下5寸，即尺泽与太渊连线的中点上1寸。肘横纹到腕横纹12寸，所以也等于腕横纹上7寸。"},{"id":"LU-loc-wrist4","type":"定位文字题","meridian":"手太阴肺经","point":"","term":"","stem":"肺经腕部穴由远及近（从腕横纹往上）的顺序是？","options":["太渊、经渠（上1寸）、列缺（上1.5寸）、孔最（上7寸）","经渠、太渊、列缺、孔最","列缺、经渠、太渊、孔最","太渊、列缺、经渠、孔最"],"answer":0,"explain":"太渊在腕横纹桡侧，经渠在腕横纹上1寸，列缺上1.5寸，孔最上7寸。"},{"id":"LU-loc-jq-ty","type":"定位文字题","meridian":"手太阴肺经","point":"经渠","term":"","stem":"按国标注，经渠与太渊的关系是？","options":["经渠在太渊上1寸","经渠在太渊下1寸","经渠在太渊上1.5寸","两穴同一位置"],"answer":0,"explain":"国标注：经渠在太渊上1寸，约当腕掌侧近端横纹中。"},{"id":"LU-loc-lq-jq","type":"定位文字题","meridian":"手太阴肺经","point":"列缺","term":"","stem":"列缺与经渠最重要的区别是？","options":["列缺在腕横纹上1.5寸两肌腱之间，经渠在腕横纹上1寸桡骨茎突与桡动脉之间","列缺在腕横纹上1寸，经渠在上1.5寸","两穴都在桡动脉搏动处","列缺在手掌，经渠在前臂"],"answer":0,"explain":"国标：列缺在腕掌侧远端横纹上1.5寸，拇短伸肌腱与拇长展肌腱之间；经渠在腕掌侧远端横纹上1寸，桡骨茎突与桡动脉之间。"},{"id":"LU-loc-ty-note","type":"定位文字题","meridian":"手太阴肺经","point":"太渊","term":"","stem":"按国标注，太渊的体表特征是？","options":["在腕掌侧远端横纹桡侧，桡动脉搏动处","在第1掌骨桡侧中点","在肘横纹上","在拇指末节桡侧"],"answer":0,"explain":"国标注：在腕掌侧远端横纹桡侧，桡动脉搏动处。"},{"id":"LU-loc-yj-lg","type":"定位文字题","meridian":"手太阴肺经","point":"鱼际","term":"","stem":"鱼际与劳宫的区别是？","options":["鱼际在第1掌骨桡侧中点赤白肉际，劳宫在第2、3掌骨之间偏于第3掌骨","鱼际在第2、3掌骨之间，劳宫在第1掌骨桡侧","两穴都在赤白肉际","鱼际在手背，劳宫在手掌"],"answer":0,"explain":"国标：鱼际在手掌，第1掌骨桡侧中点赤白肉际处；劳宫（心包经）在手掌，横平第3掌指关节近端，第2、3掌骨之间偏于第3掌骨。"},{"id":"LU-loc-ss-sy","type":"定位文字题","meridian":"手太阴肺经","point":"少商","term":"","stem":"少商与商阳的区别是？","options":["少商在拇指末节桡侧，商阳在食指末节桡侧","少商在食指，商阳在拇指","少商在拇指尺侧，商阳在食指尺侧","两穴都在拇指"],"answer":0,"explain":"国标：少商在拇指末节桡侧，指甲根角侧上方0.1寸；商阳在食指末节桡侧，指甲根角侧上方0.1寸。"},{"id":"LU-loc-6cun","type":"定位文字题","meridian":"手太阴肺经","point":"","term":"","stem":"肺经胸部两穴距前正中线的距离是？","options":["旁开6寸","旁开4寸","旁开2寸","旁开8寸"],"answer":0,"explain":"中府、云门都在前正中线旁开6寸。"},{"id":"LU-loc-region","type":"定位文字题","meridian":"手太阴肺经","point":"","term":"","stem":"肺经腧穴在上肢的分布是？","options":["上肢内侧前缘（桡侧）","上肢内侧后缘","上肢外侧前缘","上肢外侧后缘"],"answer":0,"explain":"手太阴肺经行于上肢内侧前缘。外侧前缘是手阳明大肠经。"},{"id":"LU-spec-zf-jiaohui","type":"特定穴归类","meridian":"手太阴肺经","point":"中府","term":"","stem":"肺经中属于交会穴的是？","options":["中府（手足太阴交会）","太渊","孔最","少商"],"answer":0,"explain":"中府是肺募，也是手、足太阴经的交会穴。"},{"id":"LU-spec-wuxing","type":"特定穴归类","meridian":"手太阴肺经","point":"","term":"","stem":"肺经五输穴的五行，正确的是？","options":["少商木、鱼际火、太渊土、经渠金、尺泽水","少商金、鱼际水、太渊木、经渠火、尺泽土","少商火、鱼际木、太渊金、经渠土、尺泽水","少商木、鱼际土、太渊火、经渠水、尺泽金"],"answer":0,"explain":"阴经五输穴五行按井木、荥火、输土、经金、合水排列。"},{"id":"LU-spec-yinwu","type":"名词题","meridian":"手太阴肺经","point":"","term":"","stem":"阴经五输穴的五行顺序（井、荥、输、经、合）是？","options":["木、火、土、金、水","金、水、木、火、土","水、木、火、土、金","火、土、金、水、木"],"answer":0,"explain":"阴井木，阳井金。阴经从木开始相生，阳经从金开始相生。"},{"id":"LU-spec-taiyuan-mother-why","type":"特定穴归类","meridian":"手太阴肺经","point":"太渊","term":"","stem":"太渊为肺经母穴，原因是？","options":["太渊属土，土生金，肺属金","太渊属金，与肺同属","太渊属水，金生水","太渊是原穴"],"answer":0,"explain":"肺属金，生金者为土；肺经五输中属土的是输穴太渊，故为母穴。"},{"id":"LU-spec-chize-son-why","type":"特定穴归类","meridian":"手太阴肺经","point":"尺泽","term":"","stem":"尺泽为肺经子穴，原因是？","options":["尺泽属水，金生水","尺泽属土，土生金","尺泽属金","尺泽是郄穴"],"answer":0,"explain":"金生水，水为金之子；肺经属水的是合穴尺泽，所以实证泻尺泽。"},{"id":"LU-spec-benxue","type":"特定穴归类","meridian":"手太阴肺经","point":"经渠","term":"","stem":"肺经的「本穴」（与本经五行相同的五输穴）是？","options":["经渠","太渊","尺泽","少商"],"answer":0,"explain":"肺属金，阴经经穴属金，所以经渠是本穴。"},{"id":"LU-spec-list","type":"特定穴归类","meridian":"手太阴肺经","point":"","term":"","stem":"下列肺经特定穴对应完全正确的是？","options":["郄穴孔最，络穴列缺，原穴太渊，募穴中府","郄穴列缺，络穴孔最，原穴太渊，募穴云门","郄穴孔最，络穴太渊，原穴列缺，募穴中府","郄穴尺泽，络穴列缺，原穴鱼际，募穴中府"],"answer":0,"explain":"肺经：郄孔最，络列缺，原太渊，募中府，背俞肺俞。"},{"id":"LU-spec-lieque-baimai","type":"特定穴归类","meridian":"手太阴肺经","point":"列缺","term":"","stem":"八脉交会穴中，列缺通的是？","options":["任脉","督脉","冲脉","阴维脉"],"answer":0,"explain":"列缺通任脉，与照海（通阴跷）相配，合于肺系、咽喉、胸膈。"},{"id":"LU-spec-taiyuan-3","type":"特定穴归类","meridian":"手太阴肺经","point":"太渊","term":"","stem":"太渊一穴兼具的特定穴身份是？","options":["输穴、原穴、八会穴之脉会","井穴、络穴、募穴","郄穴、络穴","合穴、下合穴"],"answer":0,"explain":"太渊是肺经输穴，阴经以输代原故又是原穴，同时是八会穴中的脉会。"},{"id":"LU-spec-lieque-2","type":"特定穴归类","meridian":"手太阴肺经","point":"列缺","term":"","stem":"列缺一穴兼具的特定穴身份是？","options":["络穴、八脉交会穴","原穴、募穴","郄穴、井穴","合穴、背俞穴"],"answer":0,"explain":"列缺是手太阴络穴，又是八脉交会穴之一（通任脉）。"},{"id":"LU-spec-none","type":"特定穴归类","meridian":"手太阴肺经","point":"","term":"","stem":"肺经中，没有五输、原、络、郄、募等特定穴身份的是？","options":["云门、天府、侠白","中府、孔最、列缺","太渊、鱼际、少商","尺泽、经渠、太渊"],"answer":0,"explain":"肺经11穴中，云门、天府、侠白没有这些特定穴属性。"},{"id":"LU-spec-xi-use","type":"特定穴归类","meridian":"手太阴肺经","point":"孔最","term":"","stem":"阴经郄穴多治血证，孔最对应的典型血证是？","options":["咳血","便血","崩漏","尿血"],"answer":0,"explain":"阴经郄穴多治血证。肺经郄穴孔最，典型是咳血。"},{"id":"LU-course-full","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"《灵枢·经脉》中肺经体内循行的顺序是？","options":["起于中焦，下络大肠，还循胃口，上膈属肺","起于中焦，上膈属肺，下络大肠","起于肺，下络大肠，还循胃口","起于胃口，上膈属肺，下络大肠"],"answer":0,"explain":"原文：肺手太阴之脉，起于中焦，下络大肠，还循胃口，上膈属肺。"},{"id":"LU-course-feixi","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"肺经「从肺系横出腋下」，肺系是指？","options":["与肺相连的气管、喉咙等","肺俞穴","胸胁","心系"],"answer":0,"explain":"肺系指与肺相连的气管、喉咙等组织。肺经从这里横出腋下。"},{"id":"LU-course-arm2","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"肺经在前臂的循行原文是？","options":["循臂内上骨下廉，入寸口","循臂外两骨之间","循臂外上廉","循臂内后廉"],"answer":0,"explain":"原文：下肘中，循臂内上骨下廉，入寸口，上鱼，循鱼际，出大指之端。"},{"id":"LU-course-end","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"肺经主干止于何处？","options":["拇指末端","食指末端","中指末端","小指末端"],"answer":0,"explain":"主干「出大指之端」（少商）；支脉「从腕后直出次指内廉，出其端」交手阳明。"},{"id":"LU-course-direct","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"手三阴经的走向是？","options":["从胸走手","从手走头","从头走足","从足走腹胸"],"answer":0,"explain":"手三阴从胸走手，手三阳从手走头，足三阳从头走足，足三阴从足走腹胸。"},{"id":"LU-course-from","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"按十二经流注，交接到肺经的上一经是？","options":["足厥阴肝经","手阳明大肠经","足太阴脾经","手少阴心经"],"answer":0,"explain":"十二经流注从肺经开始，终于肝经，肝经支脉复上注肺，交手太阴。"},{"id":"LU-course-order","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"十二经气血流注的开端是？","options":["手太阴肺经","手阳明大肠经","足阳明胃经","足厥阴肝经"],"answer":0,"explain":"流注从手太阴肺经开始，依次传至足厥阴肝经，再回到肺经，如环无端。"},{"id":"LU-course-suosheng","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"肺经「是主肺所生病」的病候是？","options":["咳，上气喘渴，烦心胸满，臑臂内前廉痛厥，掌中热","齿痛、颈肿","目黄、口干、鼽衄、喉痹","腹胀、善噫"],"answer":0,"explain":"原文如此。齿痛颈肿是大肠经是动病，目黄口干是大肠经所生病。"},{"id":"LU-course-bijue","type":"名词题","meridian":"手太阴肺经","point":"","term":"","stem":"肺经是动病中「甚则交两手而瞀」，经文称为？","options":["臂厥","骭厥","踝厥","阳厥"],"answer":0,"explain":"原文：缺盆中痛，甚则交两手而瞀，此为臂厥。"},{"id":"LU-course-sheng","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"肺经「气盛有余」时，经文所说的表现是？","options":["肩背痛，风寒，汗出中风，小便数而欠","肩背痛寒，少气不足以息，溺色变","齿痛颈肿","寒栗不复"],"answer":0,"explain":"气盛有余则肩背痛、风寒、汗出中风、小便数而欠；气虚则肩背痛寒、少气不足以息、溺色变。"},{"id":"LU-course-xu","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"肺经「气虚」时，经文所说的表现是？","options":["肩背痛寒，少气不足以息，溺色变","小便数而欠","脉所过者热肿","齿痛颈肿"],"answer":0,"explain":"原文：气虚则肩背痛寒，少气不足以息，溺色变。"},{"id":"LU-luo-course","type":"循行","meridian":"手太阴肺经","point":"列缺","term":"","stem":"手太阴络脉的循行是？","options":["起于腕上分间，并太阴之经直入掌中，散入于鱼际","起于中焦，下络大肠","从肩髃上曲颊","从腕后直出次指"],"answer":0,"explain":"原文：手太阴之别，名曰列缺，起于腕上分间，并太阴之经直入掌中，散入于鱼际。"},{"id":"LU-luo-ill","type":"循行","meridian":"手太阴肺经","point":"列缺","term":"","stem":"手太阴络脉（列缺）的病候是？","options":["实则手锐掌热，虚则欠㰦、小便遗数","实则龋聋，虚则齿寒痹隔","齿痛颈肿","肩不举"],"answer":0,"explain":"原文：其病实则手锐掌热，虚则欠㰦，小便遗数。龋聋、齿寒痹隔是手阳明络脉病候。"},{"id":"LU-jingbie","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"手太阴经别的循行特点是？","options":["入走肺，散之大肠，上出缺盆，循喉咙，复合阳明","从肩髃入柱骨，下走大肠","起于大指之上，结于鱼后","入下齿中"],"answer":0,"explain":"原文：手太阴之正，别入渊腋少阴之前，入走肺，散之大肠，上出缺盆，循喉咙，复合阳明。"},{"id":"LU-jingjin","type":"循行","meridian":"手太阴肺经","point":"","term":"","stem":"手太阴经筋的病候是？","options":["当所过者支转筋痛，甚成息贲，胁急吐血","肩不举，颈不可左右视","齿痛颈肿","实则手锐掌热"],"answer":0,"explain":"手太阴经筋病：当所过者支转筋痛，甚成息贲，胁急吐血。肩不举、颈不可左右视是手阳明经筋病。"},{"id":"LU-pibu","type":"名词题","meridian":"手太阴肺经","point":"","term":"拓展","stem":"拓展：太阴皮部的名称是？","options":["关蛰","害蜚","枢持","关枢"],"answer":0,"explain":"出处：《素问·皮部论》。十二皮部按六经命名：太阳关枢，阳明害蜚，少阳枢持，太阴关蛰，少阴枢儒，厥阴害肩。"},{"id":"LU-qixue","type":"名词题","meridian":"手太阴肺经","point":"","term":"","stem":"就气血多少而言，太阴经的特点是？","options":["多气少血","多气多血","多血少气","少气少血"],"answer":0,"explain":"《素问·血气形志》：太阴常多气少血。阳明多气多血。"},{"id":"LU-count","type":"名词题","meridian":"手太阴肺经","point":"","term":"","stem":"手太阴肺经一侧有多少个腧穴？","options":["11个","20个","9个","45个"],"answer":0,"explain":"肺经一侧11穴，左右共22穴。大肠经一侧20穴。"},{"id":"LU-song","type":"名词题","meridian":"手太阴肺经","point":"","term":"","stem":"肺经穴歌「手太阴肺十一穴，中府云门天府诀，侠白尺泽孔最存，列缺经渠太渊涉，鱼际少商如韭叶」，排在孔最之后的是？","options":["列缺","经渠","太渊","尺泽"],"answer":0,"explain":"肺经顺序：中府、云门、天府、侠白、尺泽、孔最、列缺、经渠、太渊、鱼际、少商。"},{"id":"LU-seq","type":"名词题","meridian":"手太阴肺经","point":"","term":"","stem":"肺经11穴中，尺泽之后的三个穴依次是？","options":["孔最、列缺、经渠","列缺、孔最、经渠","孔最、经渠、列缺","太渊、经渠、列缺"],"answer":0,"explain":"尺泽之后依次是孔最、列缺、经渠，再到太渊、鱼际、少商。"},{"id":"LU-sizong","type":"名词题","meridian":"手太阴肺经","point":"列缺","term":"","stem":"四总穴歌的完整内容是？","options":["肚腹三里留，腰背委中求，头项寻列缺，面口合谷收","肚腹三里留，腰背委中求，头项寻合谷，面口列缺收","头项三里留，腰背列缺求，肚腹委中求，面口合谷收","肚腹天枢留，腰背肾俞求，头项寻风池，面口合谷收"],"answer":0,"explain":"四总穴：足三里、委中、列缺、合谷。"},{"id":"LU-baimai-song","type":"名词题","meridian":"手太阴肺经","point":"列缺","term":"","stem":"八脉交会穴歌中与列缺相关的一句是？","options   var c=2*Math.PI*20,off=c*(1-(n?i/n:0));
  return '<div class="progress-ring" aria-label="进度 '+i+' / '+n+'"><svg width="52" height="52" viewBox="0 0 52 52">'+
    '<circle cx="26" cy="26" r="20" fill="none" stroke="#E4E8E6" stroke-width="4"/>'+
    '<circle cx="26" cy="26" r="20" fill="none" stroke="#1F6F6B" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 26 26)"/></svg>'+
    '<div class="frac">'+i+' / '+n+'</div></div>';
}

function setZoom(z){if(!R||R.chosen!==null)return;R.zoom=z;var el=document.getElementById("dstage");if(!el)return;el.className="diagram-stage"+(z===1.5?" z15":z===2?" z20":z===2.5?" z25":"");}
function onDiagramTap(ev){
  if(!R||R.chosen!==null)return;
  ev.preventDefault();
  var img=document.getElementById("dimg");if(!img)return;
  var pt=ev.touches?ev.touches[0]:ev;
  var rec=img.getBoundingClientRect();
  var x=(pt.clientX-rec.left)/rec.width*100,y=(pt.clientY-rec.top)/rec.height*100;
  if(x<0||x>100||y<0||y>100)return;
  R.tap={x:x,y:y};
  var old=document.getElementById("tapmark");
  if(old)old.parentNode.removeChild(old);
  var m=document.createElement("div");m.id="tapmark";m.className="dmark tap";m.style.left=x+"%";m.style.top=y+"%";
  document.getElementById("dstage").appendChild(m);
  var btn=document.getElementById("submitbtn");if(btn)btn.disabled=false;
}
function locatePanel(q,done){
  var identify=q.type==="看图认穴";
  var z=R.zoom||1,cls="diagram-stage"+(z===1.5?" z15":z===2?" z20":z===2.5?" z25":"");
  var src=FIGS[q.fig]||("diagrams/"+q.fig);
  var alt=done?q.aAlt:q.qAlt;
  var h='';
  if(identify){
    h+='<div class="d-legend"><span><i class="prompt"></i>题目标记</span>';
    if(done)h+='<span><i class="ok"></i>正确位置与容差</span>';
    h+='</div>';
  }else if(done){
    h+='<div class="d-legend"><span><i class="'+(R.ok?"tap":"wrong")+'"></i>作答点</span><span><i class="ok"></i>正确位置</span></div>';
  }
  h+='<div class="diagram-frame"><div class="diagram-wrap'+(done?" answered":"")+(identify?" identify":"")+'" id="dwrap"><div id="dstage" class="'+cls+'">';
  h+='<img id="dimg" src="'+src+'" alt="'+esc(alt)+'" draggable="false"';
  if(!done&&!identify)h+=' ontouchstart="onDiagramTap(event)" onclick="onDiagramTap(event)"';
  h+='>';
  if(identify){
    h+='<div class="dmark prompt" style="left:'+q.x+'%;top:'+q.y+'%"></div>';
    if(done){
      var dw=Math.max(2*q.tol, 8);
      h+='<div class="dmark tol" style="left:'+q.x+'%;top:'+q.y+'%;width:'+dw+'%"></div>';
    }
  }else{
    if(R.tap)h+='<div id="tapmark" class="dmark tap'+(done&&!R.ok?" wrong":"")+'" style="left:'+R.tap.x+'%;top:'+R.tap.y+'%"></div>';
    if(done){
      var dw=Math.max(2*q.tol, 8);
      h+='<div class="dmark tol" style="left:'+q.x+'%;top:'+q.y+'%;width:'+dw+'%"></div>';
      h+='<div class="dmark ok" style="left:'+q.x+'%;top:'+q.y+'%"></div>';
    }
  }
  h+='</div></div>';
  if(!done){
    h+='<div class="zoom-stack"><button type="button" class="zoom-btn" aria-label="放大" onclick="setZoom(Math.min(2.5,(R.zoom||1)+0.5))">+</button><button type="button" class="zoom-btn" aria-label="缩小" onclick="setZoom(Math.max(1,(R.zoom||1)-0.5))">−</button></div>';
  }
  h+='</div>';
  return h;
}
function afterLocateRender(q,done){
  function go(){
    var wrap=document.getElementById("dwrap"),stage=document.getElementById("dstage");
    if(wrap&&stage){
      var pts=[];
      if(q.type==="看图认穴") pts.push({x:q.x,y:q.y});
      else if(done){ pts.push({x:q.x,y:q.y}); if(R.tap) pts.push(R.tap); }
      else if(R.tap) pts.push(R.tap);
      if(pts.length){
        var ax=0,ay=0,i;
        for(i=0;i<pts.length;i++){ax+=pts[i].x;ay+=pts[i].y}
        ax/=pts.length;ay/=pts.length;
        wrap.scrollLeft=stage.offsetWidth*(ax/100)-wrap.clientWidth/2;
        wrap.scrollTop=stage.offsetHeight*(ay/100)-wrap.clientHeight/2;
      }
    }
    if(done) window.scrollTo(0,0);
  }
  var img=document.getElementById("dimg");
  if(img&&!img.complete) img.addEventListener("load",go,{once:true});
  else requestAnimationFrame(go);
}

function render(){
  var h="",app=document.getElementById("app");
  if(view==="home"){
    var dueN=scoped(dueList()).length,acc=S.today.n?Math.round(S.today.right/S.today.n*100)+"%":"—",selM=selectedMers();
    h+='<div class="page">';
    h+='<div class="eyebrow">基层诊所 · 刷题练习</div><div class="title">针灸快速学习</div>';
    h+='<button class="start-btn" onclick="start(\'all\')">'+ICONS.play+'<div class="main">开始 10 题快速练</div><div class="sub">'+esc(scopeSub())+'</div></button>';
    h+='<div class="mer-card"><div class="k">选练习范围</div><div class="mer-toggles">';
    MERIDIANS.forEach(function(m){
      var on=selM.indexOf(m.name)>=0;
      h+='<button type="button" class="mer-toggle'+(on?" on":"")+'" onclick="toggleMer(\''+m.name+'\')"><span class="dot" style="background:'+m.color+'"></span>'+esc(m.name)+(on?'<span class="chk">✓</span>':'')+'</button>';
    });
    h+='</div><div class="hint">可只练一条经，也可以两条一起练。大肠经目前只有文字题；两条都选时，还会抽到两经对比的跨经题。</div></div>';
    h+='<div class="two-up"><div class="mini-card" onclick="start(\'due\')"><div class="k">到期复习</div><div class="v">'+dueN+' 题</div></div>';
    h+='<div class="mini-card"><div class="k">今日正确率</div><div class="v">'+acc+'</div><div class="hint">已完成 '+S.today.n+' 题</div></div></div>';
    h+='<div class="recent-card"><div class="k">最近练习</div>';
    if(!S.recent.length)h+='<div class="empty" style="padding:18px 0">还没有练习记录，先来一轮吧。</div>';
    S.recent.forEach(function(it){
      var q=BANK.filter(function(x){return x.id===it.id})[0];if(!q)return;
      h+='<div class="recent-item"><span class="chip chip-ghost">'+esc(q.type)+'</span><div class="stem-one">'+esc(q.stem)+'</div>'+(it.ok?ICONS.ok:ICONS.no)+'</div>';
    });
    h+='</div><p class="disclaimer">内容以教材口径为准，仅供学习参考，不含操作剂量与疗效承诺<br><button class="link" onclick="reset()">清空记录</button></p></div>'+tabbar("home");
  }else if(view==="quiz"){
    var it=R.qs[R.i],q=it.q,n=R.qs.length,c=R.sel,done=R.chosen!==null,step=R.i+(done?1:0),locate=q.type==="点图定位",identify=q.type==="看图认穴";
    h+='<div class="page quiz"><div class="quiz-header"><button class="btn-icon" aria-label="返回" onclick="go(\'home\')">'+ICONS.back+'</button>';
    h+=ring(Math.min(R.i+1,n),n)+'<div class="progress-track"><div class="fill" style="width:'+(step/n*100)+'%"></div></div></div>';
    h+='<div class="chip-row"><span class="chip"><span class="dot" style="background:'+merColor(q.meridian)+'"></span>范围：'+esc(q.meridian)+'</span><span class="chip chip-ghost">'+esc(q.type)+'</span></div>';
    h+='<div class="stem-card card"><div class="section-label" style="margin-bottom:6px">题干</div><div class="stem-text">'+esc(q.stem)+'</div></div>';
    if(locate){
      h+=locatePanel(q,done);
      if(done){
        h+='<div class="feedback'+(R.ok?" ok":"")+'" id="locatefb"><div class="fb-title">'+(R.ok?"偏差在允许范围内 ✓":"偏差超出允许范围")+'</div>';
        h+='<div class="fb-explain">解析：'+esc(q.explain)+'</div>';
        if(!R.ok)h+='<div class="fb-note">'+ICONS.mark+'<span>加入错题本　已自动加入</span></div>';
        h+='</div>';
        h+='<div class="alt-box"><div class="k">题目图说明（读屏，作答前）</div><div class="t">'+esc(q.qAlt)+'</div></div>';
        h+='<div class="alt-box"><div class="k">答案图说明（读屏，作答后）</div><div class="t">'+esc(q.aAlt)+'</div></div>';
        h+='</div><div class="bottom-dock"><button class="btn" onclick="next()">'+(R.i+1<n?"下一题":"看本轮结果")+'</button></div>';
      }else{
        h+='</div><div class="bottom-dock"><button class="btn" id="submitbtn" onclick="answer()"'+(R.tap?"":" disabled")+'>提交</button></div>';
      }
    }else if(identify){
      h+=locatePanel(q,done);
      if(done){
        h+='<div class="feedback'+(R.ok?" ok":"")+'" id="locatefb"><div class="fb-title">'+(R.ok?"答对了":"答错了")+'</div>';
        h+='<div class="fb-explain">解析：'+esc(q.explain)+'</div>';
        if(!R.ok)h+='<div class="fb-note">'+ICONS.mark+'<span>加入错题本　已自动加入</span></div>';
        h+='</div>';
      }
      h+='<div class="options">';
      it.order.forEach(function(oi,k){
        var cls="option",mk="";
        if(done){if(oi===q.answer){cls+=" correct";mk=ICONS.ok22}else if(k===c){cls+=" wrong";mk=ICONS.no22}else cls+=" dim"}
        else if(R.sel===k)cls+=" selected";
        h+='<button class="'+cls+'" onclick="sel('+k+')"'+(done?" disabled":"")+'>'+
          '<div class="letter">'+"ABCD"[k]+'</div><div class="opt-text">'+esc(q.options[oi])+'</div>'+(mk?'<div class="mark">'+mk+'</div>':'')+'</button>';
      });
      h+='</div>';
      if(done){
        h+='<div class="alt-box"><div class="k">题目图说明（读屏，作答前）</div><div class="t">'+esc(q.qAlt)+'</div></div>';
        h+='<div class="alt-box"><div class="k">答案图说明（读屏，作答后）</div><div class="t">'+esc(q.aAlt)+'</div></div>';
        h+='</div><div class="bottom-dock"><button class="btn" onclick="next()">'+(R.i+1<n?"下一题":"看本轮结果")+'</button></div>';
      }else{
        h+='</div><div class="bottom-dock"><button class="btn" onclick="answer()"'+(R.sel==null?" disabled":"")+'>提交</button></div>';
      }
    }else{
    h+='<div class="options">';
    it.order.forEach(function(oi,k){
      var cls="option",mk="";
      if(done){if(oi===q.answer){cls+=" correct";mk=ICONS.ok22}else if(k===c){cls+=" wrong";mk=ICONS.no22}else cls+=" dim"}
      else if(R.sel===k)cls+=" selected";
      h+='<button class="'+cls+'" onclick="sel('+k+')"'+(done?" disabled":"")+'>'+
        '<div class="letter">'+"ABCD"[k]+'</div><div class="opt-text">'+esc(q.options[oi])+'</div>'+(mk?'<div class="mark">'+mk+'</div>':'')+'</button>';
    });
    h+='</div>';
    if(done){
      var ak="ABCD"[it.order.indexOf(q.answer)];
      h+='<div class="feedback'+(R.ok?" ok":"")+'"><div class="fb-title">'+(R.ok?"答对了":"答错了 · 正确答案 "+ak)+'</div>';
      h+='<div class="fb-explain">解析：'+esc(q.explain)+'</div>';
      if(!R.ok)h+='<div class="fb-note">'+ICONS.mark+'<span>加入错题本　已自动加入</span></div>';
      h+='</div></div><div class="bottom-dock"><button class="btn" onclick="next()">'+(R.i+1<n?"下一题":"看本轮结果")+'</button></div>';
    }else{
      h+='</div><div class="bottom-dock"><button class="btn" onclick="answer()"'+(R.sel==null?" disabled":"")+'>提交</button></div>';
    }
    }
  }else if(view==="result"){
    var n2=R.qs.length;
    h+='<div class="page"><div class="eyebrow">本轮练习</div><div class="title">已经完成</div>';
    h+='<div class="stat-card" style="margin:16px 0"><div class="score">'+R.right+' / '+n2+'</div><div class="small" style="text-align:center">'+(R.right===n2?"全对，这几题会隔几天再出。":"答错的题已经放进错题本，下一轮会优先出现。")+'</div></div>';
    h+='<button class="btn" onclick="start(\''+(R.mode||"all")+'\')">再来一轮</button>';
    h+='<button class="btn" style="margin-top:10px;background:#fff;color:var(--primary);border:1.5px solid var(--primary)" onclick="go(\'wrong\')">看错题本</button>';
    h+='<button class="btn" style="margin-top:10px;background:#fff;color:var(--primary);border:1.5px solid var(--primary)" onclick="go(\'home\')">回首页</button></div>'+tabbar("home");
  }else if(view==="wrong"){
    var groups={},list=wrongList();
    if(filter!=="全部")list=list.filter(function(q){return q.meridian===filter});
    list.forEach(function(q){(groups[q.meridian]=groups[q.meridian]||[]).push(q)});
    var keys=Object.keys(groups),allN=wrongList().length;
    var filters=["全部"].concat(BANK.map(function(q){return q.meridian}).filter(function(m,i,a){return a.indexOf(m)===i}));
    h+='<div class="page"><div style="display:flex;align-items:center;justify-content:space-between"><div class="title">错题本</div><span class="chip chip-ghost">'+allN+' 题</span></div>';
    h+='<div class="filter-row">';
    filters.forEach(function(f){h+='<button class="chip-filter'+(filter===f?" active":"")+'" onclick="filter='+"'"+f+"'"+';render()">'+esc(f)+'</button>'});
    h+='</div>';
    if(!keys.length)h+='<div class="card empty">还没有错题'+(filter==="全部"?"，先去练一轮吧。":"（当前筛选下没有）。")+'</div>';
    keys.forEach(function(m){
      h+='<div class="card wb-group"><span class="chip"><span class="dot" style="background:'+merColor(m)+'"></span>'+esc(m)+'</span>';
      groups[m].forEach(function(q){var r=rec(q.id);
        h+='<div class="wb-item"><span class="chip chip-ghost">'+esc(q.type)+'</span><div class="q">'+esc(q.stem)+'</div><div class="small" style="margin-top:4px"><span style="color:var(--wrong);font-weight:700">错 '+r.wrong+' 次</span> · 下次：'+fmtDue(r.due)+'</div></div>';
      });
      h+='</div>';
    });
    if(allN)h+='<button class="btn" onclick="start(\'wrong\')">只练错题（'+Math.min(ROUND,allN)+'题）</button>';
    h+='</div>'+tabbar("wrong");
  }else if(view==="progress"){
    var acc=S.total?Math.round(S.right/S.total*100)+"%":"—";
    var seen={};BANK.forEach(function(q){if(q.point&&rec(q.id).n)seen[q.point]=1});
    var types={};BANK.forEach(function(q){var r=rec(q.id);if(!types[q.type])types[q.type]={n:0,right:0};types[q.type].n+=r.n;if(r.n)types[q.type].right+=(r.n-r.wrong)});
    h+='<div class="page"><div class="eyebrow">学习记录</div><div class="title">进度</div>';
    h+='<div class="two-up" style="margin-top:16px"><div class="mini-card"><div class="k">累计作答</div><div class="v">'+S.total+'</div></div><div class="mini-card"><div class="k">总正确率</div><div class="v">'+acc+'</div></div></div>';
    h+='<div class="stat-card"><div class="k">到期复习</div><div class="v">'+dueList().length+' 题</div><div class="hint">答错的题会更快再出，答对后间隔逐步拉长（1、3、7、15、30 天）</div></div>';
    MERIDIANS.forEach(function(m){
      var n=m.points.filter(function(p){return seen[p]}).length;
      h+='<div class="stat-card" style="margin-top:12px"><div class="k"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:'+m.color+';display:inline-block;margin-right:6px;vertical-align:1px"></span>'+esc(m.short)+' '+m.points.length+' 穴覆盖</div><div class="v">'+n+' / '+m.points.length+'</div><div class="cov">';
      m.points.forEach(function(pt){h+='<span class="'+(seen[pt]?"on":"")+'">'+pt+'</span>'});
      h+='</div><div class="hint" style="margin-top:8px">'+(m.name==="手太阴肺经"?"亮起来的是已经练过的穴。文字题、点图定位和看图认穴都会记入覆盖。":"亮起来的是已经练过的穴。大肠经目前只有文字题。")+'</div></div>';
    });
    var tk=Object.keys(types).filter(function(t){return types[t].n});
    if(tk.length){
      h+='<div class="stat-card" style="margin-top:12px"><div class="k">题型正确率</div>';
      tk.forEach(function(t){var x=types[t],pct=x.n?Math.round(x.right/x.n*100):0;
        h+='<div class="bar-row"><div class="lab">'+esc(t)+'</div><div class="trk"><i style="width:'+pct+'%"></i></div><div class="num">'+pct+'%</div></div>'});
      h+='</div>';
    }
    h+='<p class="disclaimer">记录只存在这台手机的浏览器里，换设备或清缓存会丢失。<br><button class="link" onclick="reset()">清空记录</button></p></div>'+tabbar("progress");
  }
  app.innerHTML=h;
  if(view==="quiz"&&R&&R.qs&&R.qs[R.i]&&(R.qs[R.i].q.type==="点图定位"||R.qs[R.i].q.type==="看图认穴")) afterLocateRender(R.qs[R.i].q,R.chosen!==null);
}
render();
</script>
